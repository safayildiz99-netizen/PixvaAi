name: Yildiz AI V9.2.1 PayPal und Bildschrift FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Repository vollständig laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Korrigierte V9.2.1-Dateien vorbereiten
        shell: bash
        run: |
          mkdir -p /tmp/yildiz-v9-2-1
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/apply-v9-2-1-update.py
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/billing.js
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/Subscriptions.jsx
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/V9.2-PAYPAL-UPDATE.sql
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/V9.2-SUPABASE-EINFACH-OEFFNEN.html
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/V9.2-START-HIER.txt
          echo '' | base64 --decode > /tmp/yildiz-v9-2-1/PAYPAL-EMPFÄNGERKONTO.md
          python -m py_compile /tmp/yildiz-v9-2-1/apply-v9-2-1-update.py

      - name: Exakte alte V9 wiederherstellen
        shell: bash
        run: |
          git cat-file -e 3b492fde83e49bac435f703dd5ed5378b203b104^{commit}
          git rm -r --ignore-unmatch .
          git archive 3b492fde83e49bac435f703dd5ed5378b203b104 | tar -x

      - name: PayPal und Bildschrift sicher ergänzen
        shell: bash
        run: |
          cp /tmp/yildiz-v9-2-1/billing.js api/billing.js
          cp /tmp/yildiz-v9-2-1/Subscriptions.jsx client/src/components/Subscriptions.jsx
          cp /tmp/yildiz-v9-2-1/V9.2-PAYPAL-UPDATE.sql V9.2-PAYPAL-UPDATE.sql
          cp /tmp/yildiz-v9-2-1/V9.2-SUPABASE-EINFACH-OEFFNEN.html V9.2-SUPABASE-EINFACH-OEFFNEN.html
          cp /tmp/yildiz-v9-2-1/V9.2-START-HIER.txt V9.2-START-HIER.txt
          cp /tmp/yildiz-v9-2-1/PAYPAL-EMPFÄNGERKONTO.md PAYPAL-EMPFÄNGERKONTO.md
          python /tmp/yildiz-v9-2-1/apply-v9-2-1-update.py

      - name: Alle neuen Funktionen kontrollieren
        shell: bash
        run: |
          grep -q "billingSettings={uiSettings}" client/src/App.jsx
          grep -q "PayPal-Zahlungen" client/src/components/Admin.jsx
          grep -q "Schrift im KI-Bild ändern" client/src/components/DesignEditor.jsx
          grep -q "path.startsWith('/api/billing')" client/src/api.js
          grep -q "PAYPAL_CLIENT_ID" api/billing.js
          echo "PayPal und Bildschrift wurden vollständig eingesetzt."

      - name: Altes Aussehen, Login und Chat schützen
        shell: bash
        run: |
          git diff --exit-code 3b492fde83e49bac435f703dd5ed5378b203b104 --             client/public/yildiz-ai-logo.png             client/public/yildiz-ai-icon.png             client/src/components/Login.jsx             client/src/components/Chat.jsx
          echo "Logo, Icon, Login und alter Chat sind unverändert."

      - name: Vercel-Hobby-Limit prüfen
        shell: bash
        run: |
          COUNT=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "JavaScript-Dateien im api-Ordner: $COUNT"
          if [ "$COUNT" -gt 12 ]; then
            echo "Zu viele Vercel-Funktionen für den Hobby-Plan."
            exit 1
          fi

      - name: Code und Produktions-Build prüfen
        shell: bash
        run: |
          node --check api/billing.js
          node --check api/_lib.js
          npm install --prefix client
          npm run build --prefix client

      - name: Erfolgreiche V9.2.1 veröffentlichen
        shell: bash
        run: |
          git config user.name "Yildiz AI V9 Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Yildiz AI V9.2.1 PayPal und Bildschrift Fix" || exit 0
          git push origin HEAD:main
