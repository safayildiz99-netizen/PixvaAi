name: Yildiz AI V9.3 Sicherheit und Daten OHNE GELD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Repository vollständig laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen Stand merken
        shell: bash
        run: echo "BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: V9.3-Dateien vorbereiten
        shell: bash
        run: |
          mkdir -p /tmp/yildiz-v9-3/api /tmp/yildiz-v9-3/client/src/components
          echo '' | base64 --decode > /tmp/yildiz-v9-3/api/platform.js
          echo '' | base64 --decode > /tmp/yildiz-v9-3/client/src/components/SafetyCenter.jsx
          echo '' | base64 --decode > /tmp/yildiz-v9-3/client/src/components/Projects.jsx
          echo '' | base64 --decode > /tmp/yildiz-v9-3/V9.3-SUPABASE-UPDATE.sql
          echo '' | base64 --decode > /tmp/yildiz-v9-3/V9.3-STYLES.css
          echo '' | base64 --decode > /tmp/yildiz-v9-3/apply-v9-3-update.py
          python -m py_compile /tmp/yildiz-v9-3/apply-v9-3-update.py
          node --check /tmp/yildiz-v9-3/api/platform.js

      - name: Sicherheit und Daten ergänzen
        shell: bash
        run: |
          cp /tmp/yildiz-v9-3/api/platform.js api/platform.js
          cp /tmp/yildiz-v9-3/client/src/components/SafetyCenter.jsx client/src/components/SafetyCenter.jsx
          cp /tmp/yildiz-v9-3/client/src/components/Projects.jsx client/src/components/Projects.jsx
          cp /tmp/yildiz-v9-3/V9.3-SUPABASE-UPDATE.sql V9.3-SUPABASE-UPDATE.sql
          if ! grep -Fq "Yildiz AI V9.3 Sicherheit & Daten" client/src/styles.css; then
            cat /tmp/yildiz-v9-3/V9.3-STYLES.css >> client/src/styles.css
          fi
          python /tmp/yildiz-v9-3/apply-v9-3-update.py

      - name: Geldfunktionen unverändert prüfen
        shell: bash
        run: |
          git diff --exit-code "$BASE_COMMIT" --             api/billing.js             client/src/components/Subscriptions.jsx
          grep -Fq "PayPal-Zahlungen" client/src/components/Admin.jsx
          grep -Fq 'billingSettings={uiSettings}' client/src/App.jsx
          echo "PayPal, Preise, Abos und Zahlungslogik wurden nicht verändert."

      - name: Neue Funktionen prüfen
        shell: bash
        run: |
          grep -Fq "Sicherheit & Daten" client/src/App.jsx
          grep -Fq "Versionsverlauf" client/src/components/Projects.jsx
          grep -Fq "Aktuelle Websuche mit Quellen" client/src/components/SafetyCenter.jsx
          grep -Fq "app_take_rate_limit" api/_lib.js
          grep -Fq "Automatisch gespeichert" client/src/components/DesignEditor.jsx
          grep -Fq "Automatisch gespeichert" client/src/components/VideoStudio.jsx
          grep -Fq "Automatisch gespeichert" client/src/components/WebsiteBuilder.jsx
          node --check api/platform.js
          node --check api/_lib.js
          node --check api/ai/chat.js
          node --check api/ai/image.js
          node --check api/ai/video.js

      - name: Vercel-Hobby-Limit prüfen
        shell: bash
        run: |
          COUNT=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "Vercel-Funktionen: $COUNT"
          if [ "$COUNT" -gt 12 ]; then
            echo "Zu viele Serverless Functions für den Vercel-Hobby-Plan."
            exit 1
          fi

      - name: Produktions-Build testen
        shell: bash
        run: |
          npm install --prefix client
          npm run build --prefix client

      - name: Erfolgreiches Update veröffentlichen
        shell: bash
        run: |
          git config user.name "Yildiz AI Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Yildiz AI V9.3 Sicherheit Daten Versionen ohne Geldänderung" || exit 0
          git push origin HEAD:main
