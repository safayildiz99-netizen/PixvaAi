<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yildiz AI Admin-Login einrichten</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111f;color:#edf6ff;font-family:Inter,Arial,sans-serif;padding:20px}
    main{width:min(620px,100%);background:#0e2033;border:1px solid #294967;border-radius:22px;padding:28px;box-shadow:0 28px 80px #0008}
    h1{margin:0 0 8px;font-size:30px}p{color:#adc0d2;line-height:1.55}label{display:grid;gap:7px;margin:16px 0;font-weight:750}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #355a78;background:#071626;color:#fff;font-size:16px}
    button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#53c7ff,#ffe000);font-weight:900;font-size:17px;cursor:pointer}
    .notice{margin-top:16px;padding:14px;border-radius:12px;background:#12334a;color:#d9efff;line-height:1.45}
    .ok{background:#123d2a;color:#aaffcb}.bad{background:#4b1e25;color:#ffd5da}code{color:#ffe000}
  </style>
</head>
<body>
<main>
  <h1>Yildiz AI Admin-Login</h1>
  <p>Diese Seite richtet den sicheren Supabase-Auth-Admin ein. Danach kannst du dich auf der normalen Loginseite mit <code>admin</code> oder der Admin-E-Mail anmelden.</p>
  <form id="form">
    <label>Geheimes Setup-Passwort
      <input id="secret" type="password" minlength="16" autocomplete="off" required>
    </label>
    <label>Admin-E-Mail
      <input id="email" type="email" placeholder="admin@deine-domain.de" required>
    </label>
    <label>Neues Admin-Passwort
      <input id="password" type="password" minlength="10" autocomplete="new-password" required>
    </label>
    <button id="submit">Admin einrichten</button>
  </form>
  <div id="status" class="notice">Vorher in Vercel die Variable <code>ADMIN_SETUP_SECRET</code> mit demselben geheimen Setup-Passwort anlegen.</div>
</main>
<script>
const form=document.getElementById('form');
const statusBox=document.getElementById('status');
const submit=document.getElementById('submit');
form.addEventListener('submit',async(event)=>{
  event.preventDefault();
  submit.disabled=true;
  statusBox.className='notice';
  statusBox.textContent='Admin wird sicher eingerichtet…';
  try{
    const response=await fetch('/api/auth/bootstrap-admin',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        setupSecret:document.getElementById('secret').value,
        email:document.getElementById('email').value,
        password:document.getElementById('password').value
      })
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'Einrichtung fehlgeschlagen.');
    statusBox.className='notice ok';
    statusBox.innerHTML='Admin wurde eingerichtet. Gehe jetzt zur <a href="/" style="color:#fff;font-weight:900">normalen Loginseite</a> und melde dich mit <strong>admin</strong> an. Entferne anschließend <code>ADMIN_SETUP_SECRET</code> wieder aus Vercel.';
  }catch(error){
    statusBox.className='notice bad';
    statusBox.textContent=error.message;
  }finally{
    submit.disabled=false;
  }
});
</script>
</body>
</html>
