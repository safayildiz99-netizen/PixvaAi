<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXVA · Zugang wiederherstellen</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06131d;color:#edfaff;font-family:Inter,Arial,sans-serif}.card{width:min(94vw,520px);padding:28px;border:1px solid #24536b;border-radius:22px;background:linear-gradient(145deg,#0b2231,#07151f);box-shadow:0 24px 80px #0007}img{width:88px;display:block;margin:0 auto 18px}h1{text-align:center}p{color:#9fb9c8;line-height:1.5}.field{display:grid;gap:6px;margin:12px 0}input{width:100%;padding:13px;border:1px solid #285c74;border-radius:11px;background:#061722;color:white}button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(100deg,#7553dd,#2a90d8,#2bd0bf);color:white;font-weight:900;margin-top:8px}.secondary{background:#0b2634;border:1px solid #285c74}.msg{margin-top:14px;padding:11px;border-radius:10px;background:#092c2b;color:#adffe3;display:none}.bad{background:#351820;color:#ffc1ca}a{color:#62ded6}.sep{margin:20px 0;border-top:1px solid #23485a}</style></head><body><main class="card"><img src="/pixva-logo.png" alt="PIXVA"><h1>Zugang wiederherstellen</h1><p>Nutze einen Wiederherstellungscode oder fordere – wenn E-Mail eingerichtet ist – einen Link an.</p><div class="field"><span>Benutzername</span><input id="username" autocomplete="username"></div><div class="field"><span>Wiederherstellungscode</span><input id="code" autocomplete="one-time-code"></div><div class="field"><span>Neues Passwort</span><input id="password" type="password" minlength="10" autocomplete="new-password"></div><button id="submit">Passwort ändern</button><div class="sep"></div><div class="field"><span>Benutzername oder E-Mail</span><input id="identity"></div><button id="email" class="secondary">Wiederherstellungslink per E-Mail anfordern</button><div id="msg" class="msg"></div><p><a href="/">Zurück zu PIXVA</a></p></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',user=q.get('username')||'';if(user)username.value=user;function show(t,b=false){msg.textContent=t;msg.className=b?'msg bad':'msg';msg.style.display='block'}submit.onclick=async()=>{try{const r=await fetch('/api/pixva?action=recover-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,code:code.value,token,newPassword:password.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Fehler');show(d.message||'Passwort geändert.')}catch(e){show(e.message,true)}};email.onclick=async()=>{try{const r=await fetch('/api/pixva?action=recovery-email-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity:identity.value})}),d=await r.json();show(d.message||'Anfrage verarbeitet.')}catch(e){show(e.message,true)}};</script></body></html>
