<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXVA · Konto wiederherstellen</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06131d;color:#edfaff;font-family:Inter,Arial,sans-serif}.card{width:min(92vw,470px);padding:28px;border:1px solid #24536b;border-radius:22px;background:linear-gradient(145deg,#0b2231,#07151f);box-shadow:0 24px 80px #0007}img{width:88px;height:auto;display:block;margin:0 auto 18px}h1{text-align:center;margin:0 0 8px}p{color:#9fb9c8;line-height:1.5}.field{display:grid;gap:6px;margin:12px 0}.field span{font-size:12px;font-weight:700;color:#b8ceda}input{width:100%;padding:13px;border:1px solid #285c74;border-radius:11px;background:#061722;color:white;outline:none}button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(100deg,#7553dd,#2a90d8,#2bd0bf);color:white;font-weight:900;cursor:pointer;margin-top:8px}.msg{margin-top:14px;padding:11px;border-radius:10px;background:#092c2b;color:#adffe3;display:none}.msg.bad{background:#351820;color:#ffc1ca}a{color:#62ded6}</style></head>
<body><main class="card"><img src="/pixva-logo.png" alt="PIXVA"><h1>Konto wiederherstellen</h1><p>Verwende einen der einmaligen Wiederherstellungscodes aus <b>PIXVA Hub → Sicherheit & Daten</b>.</p>
<div class="field"><span>Benutzername</span><input id="username" autocomplete="username"></div><div class="field"><span>Wiederherstellungscode</span><input id="code" autocomplete="one-time-code" placeholder="XXXXXX-XXXXXX"></div><div class="field"><span>Neues Passwort</span><input id="password" type="password" minlength="10" autocomplete="new-password"></div>
<button id="submit">Passwort ändern</button><div id="msg" class="msg"></div><p><a href="/">Zurück zu PIXVA</a></p></main>
<script>document.getElementById('submit').onclick=async()=>{const b=document.getElementById('submit'),m=document.getElementById('msg');b.disabled=true;m.style.display='none';m.className='msg';try{const r=await fetch('/api/pixva?action=recover-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,code:document.getElementById('code').value,newPassword:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Fehler');m.textContent=d.message||'Passwort geändert.';m.style.display='block'}catch(e){m.textContent=e.message;m.className='msg bad';m.style.display='block'}finally{b.disabled=false}};</script></body></html>
