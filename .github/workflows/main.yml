name: PIXVA V11.1 Status Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PayPal Preise und Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.1 Status-Fix vorbereiten
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/pixva-status-fix.py
          python -m py_compile /tmp/pixva-status-fix.py

      - name: Statusanzeige korrigieren
        shell: bash
        run: |
          python /tmp/pixva-status-fix.py

      - name: Schutz prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Fix prüfen
        shell: bash
        run: |
          grep -Fq "storagePrivacy" api/pixva.js
          grep -Fq "adminUserCount" api/pixva.js
          grep -Fq "emailConfigured:emailConfigured()?'BEREIT':'OPTIONAL'" api/pixva.js
          grep -Fq "Speicher-Schutz" client/src/components/PixvaCenter.jsx
          grep -Fq "E-Mail-Wiederherstellung" client/src/components/PixvaCenter.jsx
          node --check api/pixva.js

      - name: Produktions-Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Status Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.1 Status Fix ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.1 Status Fix"
          git push origin HEAD:main
