name: PIXVA Rebrand Phase 1 FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zahlungsdateien sichern
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before

      - name: PIXVA Dateien vorbereiten
        shell: bash
        run: |
          mkdir -p client/public
          echo '' | base64 --decode > client/public/pixva-logo.png
          echo '' | base64 --decode > /tmp/pixva-brand.css
          echo '' | base64 --decode > /tmp/pixva-rebrand.py
          echo "0442e6d061d1564b95aa8accf954fba3ec6410b9820706b6659f528bf1f093ef  client/public/pixva-logo.png" | sha256sum -c -
          python -m py_compile /tmp/pixva-rebrand.py

      - name: PIXVA Branding anwenden
        shell: bash
        run: |
          python /tmp/pixva-rebrand.py

      - name: Geldsystem unverändert prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          echo "PayPal und Abos wurden nicht verändert."

      - name: PIXVA prüfen
        shell: bash
        run: |
          test -s client/public/pixva-logo.png
          echo "0442e6d061d1564b95aa8accf954fba3ec6410b9820706b6659f528bf1f093ef  client/public/pixva-logo.png" | sha256sum -c -
          grep -Fq "<title>PIXVA</title>" client/index.html
          grep -Fq "/pixva-logo.png" client/index.html
          grep -Fq "PIXVA BRAND V1" client/src/styles.css
          grep -Fq "/pixva-logo.png" client/src/components/Login.jsx
          grep -Fq "/pixva-logo.png" client/src/App.jsx
          echo "PIXVA Logo, Name und Farben sind eingesetzt."

      - name: Produktions Build testen
        shell: bash
        run: |
          npm install --prefix client
          npm run build --prefix client

      - name: PIXVA veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi
          git commit -m "PIXVA Rebrand Phase 1"
          git push origin HEAD:main
