name: PIXVA V14.11.1 FORCE LIVE DEPLOY

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen V14.11 Code semantisch prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/App.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-product-match.js
          test -f client/src/pixva-offer.js
          test -f vercel.json

          node <<'NODE'
          const fs = require('fs');

          const app = fs.readFileSync('client/src/App.jsx','utf8');
          const chat = fs.readFileSync('client/src/components/Chat.jsx','utf8');

          const checks = [
            [/function\s+openGeneratedFlyerProject\s*\(/, app, 'App besitzt openGeneratedFlyerProject().'],
            [/navigateTo\s*\(\s*['"]flyer['"]\s*\)/, app, 'Flyer-Handler wechselt zu Angebote & Flyer.'],
            [/onOpenFlyerProject\s*=\s*\{\s*openGeneratedFlyerProject\s*\}/, app, 'Chat bekommt den Flyer-Open-Callback.'],
            [/onOpenFlyerProject/, chat, 'Chat unterstützt onOpenFlyerProject.'],
            [/generateOfferFlyerMessage/, chat, 'Chat besitzt Flyer-Erstellung.']
          ];

          for (const [pattern, source, label] of checks) {
            if (!pattern.test(source)) {
              console.error('FEHLER:', label);
              process.exit(1);
            }
            console.log('OK:', label);
          }
          NODE

      - name: Produktvarianten mit echtem Runtime Test prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {
            productVariantMismatch,
            isExactProductCandidate
          } from './client/src/pixva-product-match.js';

          const requested = 'Ülker Gofret';
          const wrong = {
            title: 'Ülker Gofret Deluxe Fındıklı 220 gr',
            brand: 'Ülker'
          };
          const neutral = {
            title: 'Ülker Gofret 220 gr',
            brand: 'Ülker'
          };

          if (!productVariantMismatch(wrong, requested)) {
            throw new Error('Fındıklı/Deluxe wird noch nicht blockiert.');
          }

          if (isExactProductCandidate(wrong, requested, .56)) {
            throw new Error('Falsche Fındıklı/Deluxe-Variante wird noch akzeptiert.');
          }

          if (!isExactProductCandidate(neutral, requested, .56)) {
            throw new Error('Neutrales Ülker Gofret wird fälschlich blockiert.');
          }

          console.log('OK: Ülker Gofret blockiert ungenannte Fındıklı/Deluxe-Varianten.');
          NODE

      - name: Geschützte Dateien vor Änderung sichern
        shell: bash
        run: |
          set -euo pipefail

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Vercel SPA Cache Bust einrichten
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const file = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!Array.isArray(config.routes)) {
            throw new Error('vercel.json enthält keine routes-Liste.');
          }

          const spaRoute = config.routes.find(
            route => route && route.dest === '/index.html'
          );

          if (!spaRoute) {
            throw new Error('SPA-Route zu /index.html wurde nicht gefunden.');
          }

          spaRoute.headers = {
            ...(spaRoute.headers || {}),
            'Cache-Control': 'no-store, no-cache, must-revalidate'
          };

          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          console.log('OK: SPA-HTML wird nicht mehr als alter Browser-Build festgehalten.');
          NODE

      - name: Eindeutigen Live Build Marker erzeugen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p client/public

          cat > client/public/pixva-build.json <<EOF
          {
            "build": "PIXVA V14.11.1",
            "githubRun": "${GITHUB_RUN_NUMBER}",
            "commitBeforeDeploy": "${GITHUB_SHA}",
            "generatedAtUtc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          cat client/public/pixva-build.json

      - name: Cache und Build Marker prüfen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const config = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const route = config.routes.find(item => item?.dest === '/index.html');

          if (route?.headers?.['Cache-Control'] !== 'no-store, no-cache, must-revalidate') {
            throw new Error('Cache-Control für die SPA-Route fehlt.');
          }

          const build = JSON.parse(fs.readFileSync('client/public/pixva-build.json','utf8'));
          if (build.build !== 'PIXVA V14.11.1') {
            throw new Error('Build-Marker ist falsch.');
          }

          console.log('OK: Cache-Bust und Build-Marker vorhanden.');
          NODE

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

          echo "OK: Billing, Abos, Preise und Hauptlogo unverändert."

      - name: Vercel Hobby Function Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Live Marker prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets
          test -f client/dist/pixva-build.json

          node <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('client/dist/pixva-build.json','utf8'));

          if (build.build !== 'PIXVA V14.11.1') {
            throw new Error('pixva-build.json fehlt im Produktions-Build.');
          }

          console.log('OK: Produktions-Build enthält PIXVA V14.11.1 Marker.');
          NODE

      - name: Nur Deployment Dateien dürfen geändert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Änderungen:"
          printf '%s\n' "$CHANGED"

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              case "$FILE" in
                vercel.json|client/public/pixva-build.json) ;;
                *)
                  echo "FEHLER: Unerlaubte Änderung erkannt: $FILE"
                  exit 1
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "OK: App-Code wurde nicht erneut blind verändert."

      - name: Neuen Commit erzwingen und main aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.11.1"
          git config user.email "actions@users.noreply.github.com"

          git add -- vercel.json client/public/pixva-build.json

          if git diff --cached --quiet; then
            # Der Marker enthält die aktuelle Run-Nummer und sollte deshalb normalerweise
            # immer einen neuen Commit erzeugen. Falls exakt derselbe Run erneut fortgesetzt
            # wird, erzeugen wir bewusst einen leeren Deploy-Commit.
            git commit --allow-empty -m "PIXVA V14.11.1 Force Live Deploy Run ${GITHUB_RUN_NUMBER}"
          else
            git commit -m "PIXVA V14.11.1 Force Live Deploy Run ${GITHUB_RUN_NUMBER}"
          fi

          git push origin HEAD:main

          echo "OK: Neuer main-Commit wurde erzeugt. Dadurch bekommt Vercel einen frischen Deployment-Trigger."

      - name: Optionalen Vercel Deploy Hook auslösen
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "Vercel Deploy Hook ist vorhanden und wird zusätzlich ausgelöst."
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
            echo
            echo "OK: Vercel Deploy Hook ausgelöst."
          else
            echo "Kein VERCEL_DEPLOY_HOOK Secret gesetzt."
            echo "Der neue main-Commit bleibt der normale Vercel-Git-Deployment-Trigger."
          fi
