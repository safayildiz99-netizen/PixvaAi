name: PIXVA V14.5.4 CHAT UND VORLAGEN FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f api/ai/image-search.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          grep -Fq "scoreProductResult" api/ai/image-search.js
          grep -Fq "rankProductResults" api/ai/image-search.js

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.5.4 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-5-4
          mkdir -p /tmp/pixva-v14-5-4/payload

          echo '' | base64 --decode > /tmp/pixva-v14-5-4/payload.tar.gz
          tar -xzf /tmp/pixva-v14-5-4/payload.tar.gz -C /tmp/pixva-v14-5-4/payload

          test -f /tmp/pixva-v14-5-4/payload/client/src/components/Chat.jsx
          test -f /tmp/pixva-v14-5-4/payload/client/src/pixva-offer.js
          test -f /tmp/pixva-v14-5-4/payload/client/src/components/DesignEditorLegacy.jsx

      - name: V14.5.4 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-5-4/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-5-4/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-5-4/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx

      - name: normalizeOfferText Fehler ausschließen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "normalizeOfferText } from '../pixva-offer.js'" client/src/components/Chat.jsx
          grep -Fq "export function normalizeOfferText" client/src/pixva-offer.js

          echo "OK: normalizeOfferText ist importiert und definiert."

      - name: Beide echten Nutzerbeispiele exakt testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractOfferDraft} from './client/src/pixva-offer.js';

          const tests = [
            {
              text: 'erstele mir einen flyer für den supermarkt yaz mega center mit dem produft egetürk sucuk dilim von 4,99€ zur 3,99€',
              company: 'yaz mega center',
              product: 'egetürk sucuk dilim',
              oldPrice: '4,99 €',
              newPrice: '3,99 €'
            },
            {
              text: 'erstelle mir einen flyer für den istanbul bazar mit dem produft Ülker Gofret mit dem preis von 1,99€ zur 0,99€',
              company: 'istanbul bazar',
              product: 'ülker gofret',
              oldPrice: '1,99 €',
              newPrice: '0,99 €'
            }
          ];

          for (const test of tests) {
            const d = extractOfferDraft(test.text);
            if (d.companyType !== 'supermarkt') throw new Error(`Nicht als Supermarkt erkannt: ${test.text}`);
            if (d.companyName.toLowerCase() !== test.company) throw new Error(`Firma falsch: ${d.companyName}`);
            if (d.productName.toLowerCase() !== test.product) throw new Error(`Produkt falsch: ${d.productName}`);
            if (d.oldPrice !== test.oldPrice) throw new Error(`Alter Preis falsch: ${d.oldPrice}`);
            if (d.newPrice !== test.newPrice) throw new Error(`Neuer Preis falsch: ${d.newPrice}`);
          }

          console.log('OK: Yaz Mega Center + Egetürk erkannt.');
          console.log('OK: Istanbul Bazar + Ülker Gofret erkannt.');
          NODE

      - name: Vorlagenwechsel mit Produktdaten prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "if(project?.data?.offerDraft)await applyPixvaOfferDraftToCanvas(canvas,project.data.offerDraft);" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "if(template.industry==='supermarkt')setV12TemplateFilter('supermarkt');" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyMarketStyle(style.id)" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyTemplate(template.id)" client/src/components/DesignEditorLegacy.jsx

          echo "OK: Produkt/Preis/Bild bleiben beim Vorlagenwechsel erhalten."
          echo "OK: Supermarktvorlagen können auch bei einem neuen Produkt gewechselt werden."

      - name: Varianten Fix weiter schützen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "productVariantMismatch" client/src/components/Chat.jsx
          grep -Fq "exactCandidates" client/src/components/Chat.jsx
          grep -Fq "scoreProductResult" api/ai/image-search.js
          grep -Fq "rankProductResults" api/ai/image-search.js

          echo "OK: Classic/Original-vor-Vegan-Logik bleibt aktiv."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check client/src/pixva-offer.js
          node --check api/ai/image-search.js

          rm -rf /tmp/pixva-v14-5-4-ts
          npm install --prefix /tmp/pixva-v14-5-4-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-5-4-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');

          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{
                jsx:ts.JsxEmit.ReactJSX,
                target:ts.ScriptTarget.ES2022,
                module:ts.ModuleKind.ESNext
              },
              reportDiagnostics:true,
              fileName:file
            });

            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){
              console.error('JSX FEHLER:',file);
              for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }

          console.log('PIXVA V14.5.4 JSX CHECK PASSED');
          NODE

          NODE_PATH=/tmp/pixva-v14-5-4-ts/node_modules node /tmp/pixva-v14-5-4-jsx.cjs \
            client/src/components/Chat.jsx \
            client/src/components/DesignEditorLegacy.jsx

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          echo "PIXVA V14.5.4 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.5.4 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.5.4"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/components/Chat.jsx \
            client/src/pixva-offer.js \
            client/src/components/DesignEditorLegacy.jsx

          if git diff --cached --quiet; then
            echo "PIXVA V14.5.4 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.5.4 Chat Fehler Bazar und Vorlagenwechsel fixen"
          git push origin HEAD:main
