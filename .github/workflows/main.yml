name: PIXVA V11.8 Auto Website Admin Konten

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PayPal Preise PIXVA Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.8 Dateien vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v11-8
          mkdir -p /tmp/pixva-v11-8
          echo '' | base64 --decode > /tmp/pixva-v11-8/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8/AdminAccounts.jsx
          echo '' | base64 --decode > /tmp/apply-v11-8.py
          python -m py_compile /tmp/apply-v11-8.py

      - name: Auto Website und Admin Konten einbauen
        shell: bash
        run: |
          python /tmp/apply-v11-8.py

      - name: Geschützte Bereiche prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: V11.8 prüfen
        shell: bash
        run: |
          grep -Fq "Vorlage ist sofort bereit" client/src/components/WebsiteBuilder.jsx
          grep -Fq "BEISPIELVORSCHAU" client/src/components/WebsiteBuilder.jsx
          grep -Fq "Konten & Firmen – vollständige Admin-Übersicht" client/src/components/AdminAccounts.jsx
          grep -Fq "Firmenkonten · vom Admin erstellt" client/src/components/AdminAccounts.jsx
          grep -Fq "Alles, was dieses Konto erstellt hat" client/src/components/AdminAccounts.jsx
          grep -Fq "admin-account-overview" api/pixva.js
          grep -Fq "admin-reset-password" api/pixva.js
          grep -Fq "PIXVA V11.8 AUTO TEMPLATE" client/src/components/DesignEditor.jsx
          grep -Fq "<AdminAccounts/>" client/src/components/Admin.jsx
          node --check api/pixva.js

      - name: Produktions Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA V11.8 Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.8 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.8 Auto Website Admin Konten"
          git push origin HEAD:main
