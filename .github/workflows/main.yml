name: PIXVA V14.11.2 LOGO AUTOFIT FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand und Schutzdateien pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/DesignEditorLegacy.jsx
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Getestetes Logo Autofit Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-11-2
          mkdir -p /tmp/pixva-v14-11-2/payload

          echo '' | base64 --decode > /tmp/pixva-v14-11-2/payload.tar.gz
          tar -xzf /tmp/pixva-v14-11-2/payload.tar.gz -C /tmp/pixva-v14-11-2/payload

          test -f /tmp/pixva-v14-11-2/payload/client/src/components/DesignEditorLegacy.jsx

      - name: Nur Logo Autofit einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp \
            /tmp/pixva-v14-11-2/payload/client/src/components/DesignEditorLegacy.jsx \
            client/src/components/DesignEditorLegacy.jsx

      - name: Logo Autofit semantisch pruefen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('client/src/components/DesignEditorLegacy.jsx','utf8');

          const checks=[
            [/const\s+trimLogoMargins\s*=\s*async/, 'Logo-Rand-Erkennung vorhanden.'],
            [/nearWhite\s*=\s*red\s*>=\s*245/, 'Weiße Außenränder werden erkannt.'],
            [/startsWith\(['"]logo-image:/, 'Autofit wird nur auf Logos angewendet.'],
            [/await\s+trimLogoMargins\(resolved\)/, 'Logo wird vor dem Einsetzen bereinigt.'],
            [/bounds\.width\s*\*\s*\(isLogo\s*\?\s*\.94\s*:\s*\.90\)/, 'Logo nutzt bis zu 94 Prozent der Slot-Breite.'],
            [/Math\.min\(targetW\/Math\.max\(1,img\.width\),targetH\/Math\.max\(1,img\.height\)\)/, 'Seitenverhältnis bleibt erhalten.']
          ];

          for(const [pattern,label] of checks){
            if(!pattern.test(source)){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Nur DesignEditorLegacy darf geaendert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Aenderungen:"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
          else
            echo "(keine - Fix ist bereits identisch installiert)"
          fi

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              if [ "$FILE" != "client/src/components/DesignEditorLegacy.jsx" ]; then
                echo "FEHLER: Unerlaubte Aenderung: $FILE"
                exit 1
              fi
            done <<< "$CHANGED"
          fi

      - name: Geschuetzte Bereiche unveraendert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Vercel Hobby Limit pruefen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby Limit ueberschritten."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Build Ergebnis pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets

          ASSET_COUNT="$(find client/dist/assets -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "FEHLER: Produktions-Build enthaelt keine Assets."
            exit 1
          fi

          echo "PIXVA V14.11.2 FINAL CHECK PASSED"

      - name: Nur erfolgreichen Logo Autofit Stand veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.11.2"
          git config user.email "actions@users.noreply.github.com"

          git add -- client/src/components/DesignEditorLegacy.jsx

          if git diff --cached --quiet; then
            echo "PIXVA V14.11.2 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.11.2 Logo Autofit Fix"
          git push origin HEAD:main
