name: PIXVA Phase 3 Final Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final_polish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geldsystem vor Änderung sichern
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.before
          if [ -f V9.2-PAYPAL-UPDATE.sql ]; then sha256sum V9.2-PAYPAL-UPDATE.sql > /tmp/paypal.before; fi
          cp client/src/components/Subscriptions.jsx /tmp/Subscriptions.before.jsx

      - name: PIXVA Final-Dateien vorbereiten
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/pixva-final.css
          echo '' | base64 --decode > /tmp/pixva-final.py
          echo '' | base64 --decode > /tmp/verify-subscriptions.py
          python -m py_compile /tmp/pixva-final.py
          python -m py_compile /tmp/verify-subscriptions.py

      - name: PIXVA final polieren
        shell: bash
        run: |
          python /tmp/pixva-final.py

      - name: Geldsystem unverändert prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          diff /tmp/billing.before /tmp/billing.after
          if [ -f V9.2-PAYPAL-UPDATE.sql ]; then
            sha256sum V9.2-PAYPAL-UPDATE.sql > /tmp/paypal.after
            diff /tmp/paypal.before /tmp/paypal.after
          fi
          python /tmp/verify-subscriptions.py

      - name: PIXVA final prüfen
        shell: bash
        run: |
          grep -Fq "PIXVA FINAL POLISH V3" client/src/styles.css
          grep -R -n "PIXVA" client/src | head -20
          ! grep -R -n -E "Yildiz AI|YILDIZ AI|Yildiz-AI" client/src api/ai --exclude-dir=node_modules
          echo "Sichtbare App und KI-Branding sind PIXVA."

      - name: Produktions-Build testen
        shell: bash
        run: |
          node --check api/billing.js
          node --check api/ai/chat.js
          node --check api/ai/image.js
          node --check api/ai/video.js
          npm install --prefix client
          npm run build --prefix client

      - name: PIXVA Final veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA Final Polish ist bereits vorhanden."
            exit 0
          fi
          git commit -m "PIXVA Phase 3 Final Polish"
          git push origin HEAD:main
