name: PIXVA V14.5.2 CHECK FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PIXVA Basis prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f api/ai/image-search.js
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/data/pixva/v12/templateEngineV12.js
          test -f client/src/data/pixva/v12/marketStyles.js
          test -f client/src/data/pixva/v12/catalog.js
          grep -Fq 'v12-supermarkt-einzel' client/src/data/pixva/v12/catalog.js
          grep -Fq 'resolvePixvaMarketStyle' client/src/data/pixva/v12/templateEngineV12.js

      - name: Lokal getestetes V14.5.1 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-v14-5-1
          mkdir -p /tmp/pixva-v14-5-1/payload
          echo '' | base64 --decode > /tmp/pixva-v14-5-1/payload.tar.gz
          tar -xzf /tmp/pixva-v14-5-1/payload.tar.gz -C /tmp/pixva-v14-5-1/payload
          test -f /tmp/pixva-v14-5-1/payload/api/ai/image-search.js
          test -f /tmp/pixva-v14-5-1/payload/client/src/components/Chat.jsx
          test -f /tmp/pixva-v14-5-1/payload/client/src/components/DesignEditorLegacy.jsx
          test -f /tmp/pixva-v14-5-1/payload/client/src/data/pixva/v12/templateEngineV12.js

      - name: V14.5.1 Autofix einsetzen
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pixva-v14-5-1/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-5-1/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-5-1/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-5-1/payload/client/src/data/pixva/v12/templateEngineV12.js client/src/data/pixva/v12/templateEngineV12.js

      - name: Supermarkt-Farben und Auto-Bildlogik prüfen
        shell: bash
        run: |
          set -euo pipefail

          check_contains() {
            FILE="$1"
            NEEDLE="$2"
            LABEL="$3"
            if ! grep -Fq -- "$NEEDLE" "$FILE"; then
              echo "FEHLER: $LABEL"
              echo "Datei: $FILE"
              echo "Gesucht: $NEEDLE"
              exit 1
            fi
            echo "OK: $LABEL"
          }

          check_contains client/src/data/pixva/v12/templateEngineV12.js "primary:picked.primary" "Supermarkt-Primärfarbe kommt aus dem neuen Stil."
          check_contains client/src/data/pixva/v12/templateEngineV12.js "secondary:picked.secondary" "Supermarkt-Sekundärfarbe kommt aus dem neuen Stil."
          check_contains client/src/data/pixva/v12/templateEngineV12.js "accent:picked.accent" "Supermarkt-Akzentfarbe kommt aus dem neuen Stil."
          check_contains client/src/data/pixva/v12/templateEngineV12.js "dark:picked.dark" "Supermarkt-Kontrastfarbe kommt aus dem neuen Stil."

          check_contains client/src/components/Chat.jsx "Produktbild Packung freigestellt" "Produktbildsuche nutzt den verbesserten Packshot-Suchtext."
          check_contains client/src/components/Chat.jsx "imageUrl:first?.imageUrl||''" "Original-Bild-URL wird im Flyerentwurf gespeichert."
          check_contains client/src/components/Chat.jsx "thumbnailUrl:first?.thumbnailUrl||''" "Thumbnail-URL wird im Flyerentwurf gespeichert."

          check_contains client/src/components/DesignEditorLegacy.jsx "remoteProductUrl=draft.imageUrl||draft.thumbnailUrl||''" "Editor kann Internet-Produktbild direkt nachladen."
          check_contains client/src/components/DesignEditorLegacy.jsx '/api/ai/image-proxy?url=${encodeURIComponent(source)}' "Editor lädt Internetbilder über den bestehenden Proxy."
          check_contains client/src/components/DesignEditorLegacy.jsx "Produktbild konnte nicht in den Editor geladen werden." "Editor hat klare Produktbild-Fehlerbehandlung."

          check_contains api/ai/image-search.js "async function searchBing(query)" "Bing-Bildsuche ist als Fallback vorhanden."
          check_contains api/ai/image-search.js "async function searchOpenFoodFacts(query)" "Open Food Facts ist als Produktbild-Fallback vorhanden."
          check_contains api/ai/image-search.js "provider = 'bing'" "Bing-Provider wird erkannt."
          check_contains api/ai/image-search.js "provider = 'openfoodfacts'" "Open-Food-Facts-Provider wird erkannt."

          echo "PIXVA V14.5.2 FUNKTIONSCHECK PASSED"

      - name: JavaScript prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai/image-search.js
          node --check client/src/data/pixva/v12/templateEngineV12.js
          node --check client/src/pixva-offer.js

          rm -rf /tmp/pixva-v14-5-1-ts
          npm install --prefix /tmp/pixva-v14-5-1-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-5-1-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');
          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},
              reportDiagnostics:true,
              fileName:file
            });
            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){
              console.error('JSX FEHLER:',file);
              for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }
          console.log('PIXVA V14.5.1 JSX CHECK PASSED');
          NODE

          NODE_PATH=/tmp/pixva-v14-5-1-ts/node_modules node /tmp/pixva-v14-5-1-jsx.cjs             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo 'FEHLER: Mehr als 12 Vercel Functions.'
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d client/dist
          grep -R -Fq 'Open Food Facts' api/ai/image-search.js
          grep -R -Fq 'Bing Images' api/ai/image-search.js
          grep -R -Fq 'Supermarkt-Stil' client/dist/assets
          echo 'PIXVA V14.5.1 FINAL CHECK PASSED'

      - name: Nur vollständig erfolgreichen V14.5.2 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PIXVA V14.5.2'
          git config user.email 'actions@users.noreply.github.com'

          git add --             api/ai/image-search.js             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/data/pixva/v12/templateEngineV12.js

          if git diff --cached --quiet; then
            echo 'PIXVA V14.5.2 ist bereits installiert.'
            exit 0
          fi

          git commit -m 'PIXVA V14.5.2 Supermarkt Vorlagen und Auto Produktbild Fix'
          git push origin HEAD:main
