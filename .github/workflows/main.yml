name: PIXVA V14.6.2 VISUELLE PRODUKTPRUEFUNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/pixva.js
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/pixva-product-match.js

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.6.2 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-6-2
          mkdir -p /tmp/pixva-v14-6-2/payload

          echo '' | base64 --decode > /tmp/pixva-v14-6-2/payload.tar.gz
          tar -xzf /tmp/pixva-v14-6-2/payload.tar.gz -C /tmp/pixva-v14-6-2/payload

          test -f /tmp/pixva-v14-6-2/payload/api/pixva.js
          test -f /tmp/pixva-v14-6-2/payload/client/src/components/Chat.jsx
          test -f /tmp/pixva-v14-6-2/payload/client/src/components/DesignEditorLegacy.jsx

      - name: V14.6.2 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-6-2/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-6-2/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-6-2/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx

      - name: Visuelle Produktprüfung prüfen
        shell: bash
        run: |
          set -euo pipefail

          check() {
            FILE="$1"
            TEXT="$2"
            LABEL="$3"
            if ! grep -Fq -- "$TEXT" "$FILE"; then
              echo "FEHLER: $LABEL"
              exit 1
            fi
            echo "OK: $LABEL"
          }

          check api/pixva.js "action==='verify-product-image'" "Backend hat visuelle Produktprüfung."
          check api/pixva.js "Ein ähnliches Produkt derselben Marke reicht NICHT." "Visuelle Prüfung verlangt exaktes Produkt."
          check api/pixva.js "EGEM statt normalem Egetürk Sucuk Dilim" "EGEM wird explizit als falsche Produktlinie behandelt."

          check client/src/components/Chat.jsx "verifyProductImageVisually" "Chat prüft das Bild selbst vor dem Einfügen."
          check client/src/components/Chat.jsx "imageVerified:Boolean(imageDataUrl&&first)" "Nur bestätigte Bilder werden als verifiziert gespeichert."
          check client/src/components/Chat.jsx "Das Produktbild wurde zusätzlich VISUELL gegen die Verpackung geprüft." "Erfolgreiche visuelle Prüfung wird sichtbar bestätigt."

          check client/src/components/DesignEditorLegacy.jsx "draft.imageVerified===true" "Editor akzeptiert nur verifizierte automatische Produktbilder."
          check client/src/components/DesignEditorLegacy.jsx "Alte/ungeprüfte automatische Produktbilder dürfen niemals" "Alte automatische Bilder werden entfernt."

      - name: Parser und Variantenfilter weiter schützen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractOfferDraft} from './client/src/pixva-offer.js';
          import {isExactProductCandidate} from './client/src/pixva-product-match.js';

          const d=extractOfferDraft('erstele mir einen flyer für den supermarkt yaz mega center mit dem produft egetürk sucuk dilim von 4,99€ zur 3,99€');

          if(d.productName.toLowerCase()!=='egetürk sucuk dilim')
            throw new Error('Produktparser falsch: '+d.productName);

          if(isExactProductCandidate({title:'Egetürk EGEM Dilim Sucuk'},d.productName,.66))
            throw new Error('EGEM wurde im Metadatenfilter fälschlich akzeptiert.');

          if(isExactProductCandidate({title:'Egetürk Vegan Dilim Sucuk'},d.productName,.66))
            throw new Error('Vegan wurde im Metadatenfilter fälschlich akzeptiert.');

          if(!isExactProductCandidate({title:'Egetürk Sucuk Dilim Classic Original'},d.productName,.66))
            throw new Error('Classic/Original wurde nicht akzeptiert.');

          console.log('OK: Egetürk Sucuk Dilim Parser.');
          console.log('OK: EGEM/Vegan blockiert.');
          console.log('OK: Classic/Original akzeptiert.');
          NODE

      - name: JavaScript prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/pixva.js
          node --check client/src/pixva-offer.js
          node --check client/src/pixva-product-match.js

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          if ! grep -R -Fq "VISUELL gegen die Verpackung geprüft" client/dist/assets; then
            echo "FEHLER: Visuelle Produktprüfung fehlt im gebauten Frontend."
            exit 1
          fi

          if ! grep -R -Fq "imageVerified" client/dist/assets; then
            echo "FEHLER: Verifizierungsstatus fehlt im gebauten Frontend."
            exit 1
          fi

          echo "PIXVA V14.6.2 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.6.2 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.6.2"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            api/pixva.js \
            client/src/components/Chat.jsx \
            client/src/components/DesignEditorLegacy.jsx

          if git diff --cached --quiet; then
            echo "PIXVA V14.6.2 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.6.2 Produktbild visuell pruefen und alte Bilder entfernen"
          git push origin HEAD:main
