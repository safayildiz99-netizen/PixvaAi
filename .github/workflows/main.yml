name: PIXVA V14.12 9ER FINAL FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-multi-offer.js
          test -f api/ai/image-search.js
          test -f client/src/components/DesignEditorLegacy.jsx

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

          echo "OK: Basis vorhanden."

      - name: Lokal getestetes 9er Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-12
          mkdir -p /tmp/pixva-v14-12/payload

          echo '' | base64 --decode > /tmp/pixva-v14-12/payload.tar.gz
          tar -xzf /tmp/pixva-v14-12/payload.tar.gz -C /tmp/pixva-v14-12/payload

          test -f /tmp/pixva-v14-12/payload/client/src/components/Chat.jsx
          test -f /tmp/pixva-v14-12/payload/client/src/pixva-multi-offer.js
          test -f /tmp/pixva-v14-12/payload/api/ai/image-search.js

      - name: 9er Fix einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-12/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-12/payload/client/src/pixva-multi-offer.js client/src/pixva-multi-offer.js
          cp /tmp/pixva-v14-12/payload/api/ai/image-search.js api/ai/image-search.js

      - name: Exakten Yaz City 9er Auftrag testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractMultiOfferDraft} from './client/src/pixva-multi-offer.js';

          const prompt='erstelle mir ein 9er angebot mit den produkten:Sütdana Kemikli 7,99€ kg ,Kanat incik 3kg 9,99€,Kervan erzincan peynirler 45/55/60 800g 5,99€,Yörem 55/60 800g 3,99€,Birinci 5 litre oliven öl 22,99€,Duru pilavlik pirinc 5kg 8,99€,Marmara baldo 5kg 8,99€,Balkaneeta kupus sauerkreut 1,49€,Öncü cam salcalar 700g 3,99€, für den supermarkt Yaz City';

          const d=extractMultiOfferDraft(prompt);

          if(!d) throw new Error('Kein Mehrprodukt-Entwurf erzeugt.');
          if(d.requestedCount!==9) throw new Error(`requestedCount=${d.requestedCount} statt 9`);
          if(d.layoutCount!==9) throw new Error(`layoutCount=${d.layoutCount} statt 9`);
          if(d.templateId!=='v12-supermarkt-9er') throw new Error(`Falsche Vorlage: ${d.templateId}`);
          if(d.products.length!==9) throw new Error(`Nur ${d.products.length}/9 Produkte erkannt.`);
          if(String(d.companyName).toLowerCase()!=='yaz city') throw new Error(`Firma falsch: ${d.companyName}`);

          const expected=[
            ['Sütdana Kemikli','7,99 € / kg'],
            ['Kanat incik 3kg','9,99 €'],
            ['Kervan erzincan peynirler 45/55/60 800g','5,99 €'],
            ['Yörem 55/60 800g','3,99 €'],
            ['Birinci 5 litre oliven öl','22,99 €'],
            ['Duru pilavlik pirinc 5kg','8,99 €'],
            ['Marmara baldo 5kg','8,99 €'],
            ['Balkaneeta kupus sauerkreut','1,49 €'],
            ['Öncü cam salcalar 700g','3,99 €']
          ];

          expected.forEach(([name,price],i)=>{
            const p=d.products[i];
            if(p.productName!==name) throw new Error(`Produkt ${i+1} falsch: ${p.productName}`);
            if(p.newPrice!==price) throw new Error(`Preis ${i+1} falsch: ${p.newPrice}`);
          });

          console.log('OK: Yaz City 9er = 9/9 Produkte, 9er Vorlage, richtige Preise.');
          NODE

      - name: 9er auch ohne saubere Kommas testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractMultiOfferDraft} from './client/src/pixva-multi-offer.js';

          const prompt='erstelle mir ein 9er angebot mit den produkten: Sütdana Kemikli 7,99€ kg Kanat incik 3kg 9,99€ Kervan erzincan peynirler 45/55/60 800g 5,99€ Yörem 55/60 800g 3,99€ Birinci 5 litre oliven öl 22,99€ Duru pilavlik pirinc 5kg 8,99€ Marmara baldo 5kg 8,99€ Balkaneeta kupus sauerkreut 1,49€ Öncü cam salcalar 700g 3,99€ für den supermarkt Yaz City';

          const d=extractMultiOfferDraft(prompt);
          if(!d || d.products.length!==9) {
            throw new Error(`Robuster Parser erkennt nur ${d?.products?.length||0}/9 Produkte.`);
          }

          console.log('OK: 9er funktioniert auch bei unsauberen Trennzeichen.');
          NODE

      - name: Chat muss 9 Produkte wirklich weiterreichen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const chat=fs.readFileSync('client/src/components/Chat.jsx','utf8').replace(/\s+/g,'');

          const checks=[
            [chat.includes('constrequestedCount=Math.max(2,Number('), 'requestedCount wird hart berücksichtigt.'],
            [chat.includes('if(sourceProducts.length!==requestedCount)'), 'Falsche Produktanzahl wird nicht still akzeptiert.'],
            [chat.includes("templateId:requestedCount>=9?'v12-supermarkt-9er'"), '9er erzwingt 9er Vorlage.'],
            [chat.includes('mapWithConcurrency(sourceProducts,4'), 'Produktbilder werden parallel gesucht.'],
            [chat.includes('.slice(0,9)'), 'Chat kann bis zu 9 Produktkarten anzeigen.']
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Editor muss Mehrprodukt Slots unterstuetzen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const editor=fs.readFileSync('client/src/components/DesignEditorLegacy.jsx','utf8').replace(/\s+/g,'');

          const checks=[
            [editor.includes('extractMultiOfferDraft'), 'Editor kann Mehrprodukt-Prompt erneut reparieren.'],
            [editor.includes('for(letindex=0;index<products.length;index++)'), 'Editor verarbeitet alle Produkte.'],
            [editor.includes('product-slot:${slotIndex}'), 'Jedes Produkt bekommt seinen eigenen Slot.'],
            [editor.includes('product-image:${slotIndex}'), 'Jedes Produkt bekommt sein eigenes Bild.'],
            [editor.includes('price:${slotIndex}'), 'Jedes Produkt bekommt seinen eigenen Preis.']
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Schnelle Produktsuche pruefen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const search=fs.readFileSync('api/ai/image-search.js','utf8').replace(/\s+/g,'');

          const checks=[
            [search.includes('Promise.allSettled('), 'Fallback-Bildquellen laufen parallel.'],
            [search.includes('withProviderDeadline'), 'Provider haben Zeitlimits.'],
            [search.includes('controller.abort(),6500'), 'Einzelne Web-Abfragen warten nicht endlos.']
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: JavaScript pruefen
        shell: bash
        run: |
          set -euo pipefail

          node --check client/src/pixva-multi-offer.js
          node --check api/ai/image-search.js

      - name: Nur 9er Dateien duerfen geaendert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Aenderungen:"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
          else
            echo "(keine - 9er Fix ist bereits identisch installiert)"
          fi

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              case "$FILE" in
                client/src/components/Chat.jsx|client/src/pixva-multi-offer.js|api/ai/image-search.js) ;;
                *) echo "FEHLER: Unerlaubte Aenderung: $FILE"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "OK: Nur 9er-bezogene Dateien betroffen."

      - name: Geld Preise Abos und Hauptlogo unveraendert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

          echo "OK: Geschuetzte Bereiche unveraendert."

      - name: Vercel Hobby Limit pruefen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby Limit ueberschritten."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Build final pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets

          ASSET_COUNT="$(find client/dist/assets -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "FEHLER: Produktions-Build enthaelt keine Assets."
            exit 1
          fi

          echo "PIXVA V14.12 9ER FINAL CHECK PASSED"

      - name: Nur erfolgreichen 9er Stand veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.12"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/components/Chat.jsx \
            client/src/pixva-multi-offer.js \
            api/ai/image-search.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.12 9er Fix ist bereits installiert. Alle Tests und Build waren erfolgreich."
            exit 0
          fi

          git commit -m "PIXVA V14.12 9er Werbung final fix"
          git push origin HEAD:main
