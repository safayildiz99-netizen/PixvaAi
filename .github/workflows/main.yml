name: PIXVA V11.8.2.1 SYNTAX FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight aktuelle V11.8.1 Basis
        shell: bash
        run: |
          set -e
          test -f client/src/components/Admin.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/components/DesignEditor.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f api/ai/admin-accounts.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          grep -Fq "PIXVA V11.8.1 ADMIN WRAPPER" client/src/components/Admin.jsx
          grep -Fq "PIXVA V11.8.1 DESIGN WRAPPER" client/src/components/DesignEditor.jsx

      - name: Geld und Hauptlogo schützen
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Payload vor Installation vollständig prüfen
        shell: bash
        run: |
          set -e
          rm -rf /tmp/pixva-v11-8-2
          mkdir -p /tmp/pixva-v11-8-2
          echo '' | base64 --decode > /tmp/pixva-v11-8-2/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-2/DesignEditor.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-2/AdminAccounts.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-2/admin-accounts.js
          echo '' | base64 --decode > /tmp/pixva-v11-8-2/extra.css
          echo '' | base64 --decode > /tmp/apply-pixva-v11-8-2.py
          echo '' | base64 --decode > /tmp/check-jsx.cjs

          python -m py_compile /tmp/apply-pixva-v11-8-2.py

          cp /tmp/pixva-v11-8-2/admin-accounts.js /tmp/admin-accounts-check.mjs
          node --check /tmp/admin-accounts-check.mjs

          node /tmp/check-jsx.cjs             /tmp/pixva-v11-8-2/AdminAccounts.jsx             /tmp/pixva-v11-8-2/DesignEditor.jsx             /tmp/pixva-v11-8-2/WebsiteBuilder.jsx

          grep -Fq "Kunden-/Privatkonto" /tmp/pixva-v11-8-2/AdminAccounts.jsx
          grep -Fq "Geschäftskonto" /tmp/pixva-v11-8-2/AdminAccounts.jsx
          grep -Fq "Programmierer / Software & KI" /tmp/pixva-v11-8-2/AdminAccounts.jsx
          grep -Fq "39,99 €" /tmp/pixva-v11-8-2/DesignEditor.jsx
          grep -Fq "29,99 €" /tmp/pixva-v11-8-2/DesignEditor.jsx
          grep -Fq "25% RABATT" /tmp/pixva-v11-8-2/DesignEditor.jsx
          grep -Fq "/pixva-logo.png" /tmp/pixva-v11-8-2/DesignEditor.jsx
          echo "VORPRÜFUNG KOMPLETT GRÜN."

      - name: V11.8.2.1 einsetzen
        shell: bash
        run: |
          set -e
          python /tmp/apply-pixva-v11-8-2.py

      - name: Installierten Stand erneut prüfen
        shell: bash
        run: |
          set -e
          grep -Fq "PIXVA V11.8.2 WEBSITE" client/src/components/WebsiteBuilder.jsx
          grep -Fq "PIXVA V11.8.2 DESIGN WRAPPER" client/src/components/DesignEditor.jsx
          grep -Fq "PIXVA V11.8.2 ADMIN" client/src/components/AdminAccounts.jsx
          grep -Fq "api('/api/users')" client/src/components/AdminAccounts.jsx
          grep -Fq "pixvaPrepared" client/src/components/DesignEditorLegacy.jsx

          cp api/ai/admin-accounts.js /tmp/admin-accounts-installed.mjs
          node --check /tmp/admin-accounts-installed.mjs

          node /tmp/check-jsx.cjs             client/src/components/AdminAccounts.jsx             client/src/components/DesignEditor.jsx             client/src/components/WebsiteBuilder.jsx
          echo "INSTALLIERTER STAND KOMPLETT GRÜN."

      - name: Geld und Hauptlogo unverändert prüfen
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build erst jetzt
        shell: bash
        run: |
          set -e
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          set -e
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -e
          git config user.name "PIXVA V11.8.2.1 Syntax Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "V11.8.2.1 bereits vorhanden."
            exit 0
          fi
          git commit -m "PIXVA V11.8.2.1 Syntax Fix"
          git push origin HEAD:main
