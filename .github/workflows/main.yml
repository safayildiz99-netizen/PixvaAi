name: PIXVA V11.8.1 SAFE FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Schneller Preflight vor dem langen Build
        shell: bash
        run: |
          set -e
          test -f client/src/components/Admin.jsx
          test -f client/src/components/DesignEditor.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f client/src/styles.css
          test -f api/_lib.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          grep -Fq "export default" client/src/components/Admin.jsx
          grep -Fq "export default" client/src/components/DesignEditor.jsx
          echo "Grundstruktur vorhanden."

      - name: PayPal Preise PIXVA Logo schützen
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.8.1 Payload vorbereiten
        shell: bash
        run: |
          set -e
          rm -rf /tmp/pixva-v11-8-1
          mkdir -p /tmp/pixva-v11-8-1
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/admin-accounts.js
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/AdminAccounts.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/Admin.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/DesignEditor.jsx
          echo '' | base64 --decode > /tmp/pixva-v11-8-1/extra.css
          echo '' | base64 --decode > /tmp/apply-pixva-v11-8-1.py
          python -m py_compile /tmp/apply-pixva-v11-8-1.py
          node --check /tmp/pixva-v11-8-1/admin-accounts.js
          echo "Payload-Syntax geprüft."

      - name: Safe Fix ohne fragile Admin JSX Anker einbauen
        shell: bash
        run: |
          set -e
          python /tmp/apply-pixva-v11-8-1.py

      - name: Schnelle Strukturprüfung vor dem Produktions-Build
        shell: bash
        run: |
          set -e
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f api/ai/admin-accounts.js
          grep -Fq "PIXVA V11.8.1 ADMIN WRAPPER" client/src/components/Admin.jsx
          grep -Fq "PIXVA V11.8.1 DESIGN WRAPPER" client/src/components/DesignEditor.jsx
          grep -Fq "Vorlage ist sofort bereit" client/src/components/WebsiteBuilder.jsx
          grep -Fq "BEISPIELVORSCHAU" client/src/components/WebsiteBuilder.jsx
          grep -Fq "Firmenkonten · vom Admin erstellt" client/src/components/AdminAccounts.jsx
          grep -Fq "Alles, was dieses Konto erstellt hat" client/src/components/AdminAccounts.jsx
          grep -Fq "app_reset_password_by_user" api/ai/admin-accounts.js
          node --check api/ai/admin-accounts.js
          echo "Alle schnellen Prüfungen bestanden. Erst jetzt startet npm/build."

      - name: Geschützte Bereiche unverändert prüfen
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after
          echo "PayPal, Preise/Abos und PIXVA-Hauptlogo unverändert."

      - name: Produktions Build
        shell: bash
        run: |
          set -e
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          set -e
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -e
          git config user.name "PIXVA V11.8.1 Safe Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.8.1 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.8.1 Safe Auto Website Admin Konten"
          git push origin HEAD:main
