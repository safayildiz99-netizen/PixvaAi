name: PIXVA V12.1 KONTEN SOFORT FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V12 Stand und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f api/ai/admin-accounts.js
          test -f api/pixva.js
          test -f lib/pixva-brain.js
          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Getestete V12.1 Dateien vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-v12-1
          mkdir -p /tmp/pixva-v12-1
          echo '' | base64 --decode > /tmp/pixva-v12-1/fix.tar.gz
          tar -tzf /tmp/pixva-v12-1/fix.tar.gz > /tmp/pixva-v12-1/files.txt

          test "$(wc -l < /tmp/pixva-v12-1/files.txt | tr -d ' ')" -eq 4
          grep -Fxq "api/ai/admin-accounts.js" /tmp/pixva-v12-1/files.txt
          grep -Fxq "api/pixva.js" /tmp/pixva-v12-1/files.txt
          grep -Fxq "lib/pixva-brain.js" /tmp/pixva-v12-1/files.txt
          grep -Fxq "client/src/components/AdminAccounts.jsx" /tmp/pixva-v12-1/files.txt

          mkdir -p /tmp/pixva-v12-1/payload
          tar -xzf /tmp/pixva-v12-1/fix.tar.gz -C /tmp/pixva-v12-1/payload

          node --check /tmp/pixva-v12-1/payload/api/ai/admin-accounts.js
          node --check /tmp/pixva-v12-1/payload/api/pixva.js
          node --check /tmp/pixva-v12-1/payload/lib/pixva-brain.js
          grep -Fq "accountType:a.account_type||a.stored_account_type" /tmp/pixva-v12-1/payload/client/src/components/AdminAccounts.jsx
          grep -Fq "sofort aktiv" /tmp/pixva-v12-1/payload/client/src/components/AdminAccounts.jsx

      - name: V12.1 Kontenfix einsetzen
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pixva-v12-1/payload/api/ai/admin-accounts.js api/ai/admin-accounts.js
          cp /tmp/pixva-v12-1/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v12-1/payload/lib/pixva-brain.js lib/pixva-brain.js
          cp /tmp/pixva-v12-1/payload/client/src/components/AdminAccounts.jsx client/src/components/AdminAccounts.jsx

          node --check api/ai/admin-accounts.js
          node --check api/pixva.js
          node --check lib/pixva-brain.js

      - name: Geschäftskonto und Privatkonto ohne neue DB Spalten testen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > pixva-account-compat-test.mjs
          node pixva-account-compat-test.mjs
          rm pixva-account-compat-test.mjs

      - name: V12 Funktionen und Geldsystem schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "pixva-account-profile" api/ai/admin-accounts.js
          grep -Fq "profileStorage:'memory+brand-kit'" api/ai/admin-accounts.js
          grep -Fq "PIXVA Firmenprofil" lib/pixva-brain.js
          test "$(grep -Fc 'function resolveType(base,extra)' client/src/components/AdminAccounts.jsx)" -eq 1
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nur vollständig erfolgreichen Fix veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          test -d client/dist
          git config user.name "PIXVA V12.1"
          git config user.email "actions@users.noreply.github.com"
          git add api/ai/admin-accounts.js api/pixva.js lib/pixva-brain.js client/src/components/AdminAccounts.jsx

          if git diff --cached --quiet; then
            echo "PIXVA V12.1 Kontenfix ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V12.1 Konten sofort speichern und korrekt trennen"
          git push origin HEAD:main
