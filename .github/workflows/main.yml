name: PIXVA V14.3.1 PRODUKTMODUL ENTFERNEN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/Login.jsx
          test -f api/ai/admin-accounts.js
          test -f client/src/pixva-offer.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Nur die drei korrigierten Dateien einsetzen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > client/src/components/AdminAccounts.jsx
          echo '' | base64 --decode > client/src/components/Login.jsx
          echo '' | base64 --decode > api/ai/admin-accounts.js

      - name: Produktmodul wirklich entfernt prüfen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          admin=Path("client/src/components/AdminAccounts.jsx").read_text(encoding="utf-8")
          backend=Path("api/ai/admin-accounts.js").read_text(encoding="utf-8")
          login=Path("client/src/components/Login.jsx").read_text(encoding="utf-8")

          required_admin=[
            "['1 · Admin',accounts.filter(a=>a.role==='admin')]",
            "['2 · Kunden',accounts.filter(a=>a.role!=='admin')]"
          ]
          for item in required_admin:
              if item not in admin:
                  raise SystemExit("FEHLER: Erwartete Kontenaufteilung fehlt: "+item)

          if "Chat, Wissen, Designs, Agenten und Medien" not in login:
              raise SystemExit("FEHLER: Login-Text wurde nicht korrigiert.")

          forbidden_admin=["c.products",'title="Produkte"',"Produkte</span>"]
          for item in forbidden_admin:
              if item in admin:
                  raise SystemExit("FEHLER: Produktmodul ist im Konto noch sichtbar: "+item)

          forbidden_backend=["app_products","productMap","products:"]
          for item in forbidden_backend:
              if item in backend:
                  raise SystemExit("FEHLER: Admin-Backend lädt Produktmodul weiterhin: "+item)

          print("OK: Kontoansicht hat nur Projekte, Wissen und KI.")
          print("OK: Admin-Backend fragt app_products nicht mehr ab.")
          PY

      - name: Flyer Produktfunktion ausdrücklich schützen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "extractOfferDraft" client/src/pixva-offer.js
          grep -Fq "productName" client/src/pixva-offer.js
          grep -Fq "newPrice" client/src/pixva-offer.js

          echo "OK: Produkte innerhalb von Flyern und Angeboten bleiben erhalten."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/ai/admin-accounts.js

          rm -rf /tmp/pixva-ts
          npm install --prefix /tmp/pixva-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');
          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},
              reportDiagnostics:true,
              fileName:file
            });
            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){
              console.error("JSX FEHLER:",file);
              for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }
          console.log("JSX CHECK PASSED");
          NODE

          NODE_PATH=/tmp/pixva-ts/node_modules node /tmp/pixva-jsx.cjs \
            client/src/components/AdminAccounts.jsx \
            client/src/components/Login.jsx

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.3.1"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/components/AdminAccounts.jsx \
            client/src/components/Login.jsx \
            api/ai/admin-accounts.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.3.1 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.3.1 nicht vorhandenes Produktmodul entfernen"
          git push origin HEAD:main
