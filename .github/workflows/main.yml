name: PIXVA V11.5 Firmen System Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geschützte Bereiche sichern
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.5 vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v11-5
          mkdir -p /tmp/pixva-v11-5
          echo '' | base64 --decode > /tmp/pixva-v11-5/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/apply-v11-5.py
          python -m py_compile /tmp/apply-v11-5.py

      - name: Firmen-System verbinden
        shell: bash
        run: |
          python /tmp/apply-v11-5.py

      - name: Geschützte Bereiche prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: V11.5 Funktionen prüfen
        shell: bash
        run: |
          grep -Fq "Firmenprofil & Theme übernehmen" client/src/components/WebsiteBuilder.jsx
          grep -Fq "logoDataUrl" client/src/components/WebsiteBuilder.jsx
          grep -Fq "pixvaCompanyTemplate" client/src/components/DesignEditor.jsx
          grep -Fq "accountGroups" client/src/components/PixvaCenter.jsx
          grep -Fq "created_source" api/pixva.js
          grep -Fq "account-meta-update" api/pixva.js
          grep -Fq "PIXVA V11.5 FIRMEN SYSTEM" client/src/styles.css
          node --check api/pixva.js

      - name: Produktions Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA V11.5 Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.5 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.5 Firmen System Fix"
          git push origin HEAD:main
