name: PIXVA V14.10.5.1 IDEMPOTENTE DATEIPRUEFUNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/App.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f api/pixva.js

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

          echo "OK: Basis und geschützte Dateien vorhanden."

      - name: Getestetes V14.10.5 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-10-4
          mkdir -p /tmp/pixva-v14-10-4/payload

          echo '' | base64 --decode > /tmp/pixva-v14-10-4/payload.tar.gz
          tar -xzf /tmp/pixva-v14-10-4/payload.tar.gz -C /tmp/pixva-v14-10-4/payload

          test -f /tmp/pixva-v14-10-4/payload/client/src/App.jsx
          test -f /tmp/pixva-v14-10-4/payload/client/src/mobile-admin-fix.css

          echo "OK: V14.10.4 Payload vollständig."

      - name: V14.10.5 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-10-4/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-10-4/payload/client/src/mobile-admin-fix.css client/src/mobile-admin-fix.css

      - name: Vorlagen Ausblenden semantisch prüfen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');

          const app=fs.readFileSync('client/src/App.jsx','utf8').replace(/\s+/g,'');
          const editor=fs.readFileSync('client/src/components/DesignEditorLegacy.jsx','utf8').replace(/\s+/g,'');
          const api=fs.readFileSync('api/pixva.js','utf8').replace(/\s+/g,'');

          const checks=[
            [app.includes("templateConfig:{hiddenBuiltInIds:[],customTemplates:[]}"), 'App hat templateConfig Default.'],
            [app.includes("/api/pixva?action=template-settings"), 'App lädt gespeicherte Vorlagen-Sichtbarkeit.'],
            [app.includes("templateConfig={uiSettings.templateConfig}"), 'App gibt templateConfig an den Editor weiter.'],
            [editor.includes("templateConfig={}"), 'Editor akzeptiert templateConfig.'],
            [editor.includes("hiddenTemplateIds.has(template.id)"), 'Editor filtert ausgeblendete Standardvorlagen.'],
            [api.includes("action==='template-settings'"), 'Backend liefert template-settings.'],
            [api.includes("action==='template-settings-save'"), 'Backend speichert template-settings.'],
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Mobile Admin semantisch prüfen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('client/src/App.jsx','utf8').replace(/\s+/g,'');
          const css=fs.readFileSync('client/src/mobile-admin-fix.css','utf8').replace(/\s+/g,'');

          const checks=[
            [app.includes("import'./mobile-admin-fix.css'") || app.includes("import\"./mobile-admin-fix.css\""), 'Mobile-CSS wird geladen.'],
            [app.includes("isMobile&&activeUser.role==='admin'"), 'Admin bekommt auf Mobile einen direkten Menüeintrag.'],
            [app.includes("mobile-admin-shortcut"), 'Mobile-Admin-Schaltfläche ist vorhanden.'],
            [css.includes("height:100dvh!important"), 'Sidebar bleibt innerhalb der Handyhöhe.'],
            [css.includes("overflow-y:auto!important"), 'Hauptnavigation kann auf dem Handy scrollen.'],
            [css.includes(".sidebar-bottom"), 'Unterer Kontobereich bleibt separat sichtbar.'],
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Nur erlaubte App Dateien dürfen geändert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Änderungen:"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
          else
            echo "(keine – Fix ist bereits identisch installiert)"
          fi

          ALLOWED_APP='client/src/App.jsx'
          ALLOWED_CSS='client/src/mobile-admin-fix.css'

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              if [ "$FILE" != "$ALLOWED_APP" ] && [ "$FILE" != "$ALLOWED_CSS" ]; then
                echo "FEHLER: Unerlaubte Änderung erkannt: $FILE"
                exit 1
              fi
            done <<< "$CHANGED"
          fi

          test -f "$ALLOWED_APP"
          test -f "$ALLOWED_CSS"

          echo "OK: Keine unerlaubten Dateien geändert."
          echo "OK: 0, 1 oder 2 erlaubte Änderungen sind zulässig."

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

          echo "OK: Billing, Abos, Preise und PIXVA Hauptlogo unverändert."

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Build Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets

          ASSET_COUNT="$(find client/dist/assets -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "FEHLER: Der Produktions-Build enthält keine Assets."
            exit 1
          fi

          echo "OK: Produktions-Build enthält $ASSET_COUNT Assets."

      - name: Nur vollständig erfolgreichen V14.10.4 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.10.5.1"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/App.jsx \
            client/src/mobile-admin-fix.css

          if git diff --cached --quiet; then
            echo "PIXVA V14.10.5.1 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.10.5.1 Vorlagen und Mobile Admin Fix"
          git push origin HEAD:main
