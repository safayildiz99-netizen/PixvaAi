name: PIXVA V14.5 SUPERMARKT POSTREADY

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/data/pixva/v12/templateEngineV12.js
          test -f client/src/data/pixva/v12/catalog.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          grep -Fq "v12-supermarkt-einzel" client/src/data/pixva/v12/catalog.js
          grep -Fq "v12-supermarkt-6er" client/src/data/pixva/v12/catalog.js
          grep -Fq "v12-supermarkt-9er" client/src/data/pixva/v12/catalog.js

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.5 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-5
          mkdir -p /tmp/pixva-v14-5/payload

          echo '' | base64 --decode > /tmp/pixva-v14-5/payload.tar.gz
          tar -xzf /tmp/pixva-v14-5/payload.tar.gz -C /tmp/pixva-v14-5/payload

          test -f /tmp/pixva-v14-5/payload/client/src/data/pixva/v12/marketStyles.js
          test -f /tmp/pixva-v14-5/payload/client/src/data/pixva/v12/templateEngineV12.js
          test -f /tmp/pixva-v14-5/payload/client/src/components/DesignEditorLegacy.jsx

          COUNT="$(find /tmp/pixva-v14-5/payload/client/public/templates/pixva-market-v14 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 16 ]; then
            echo "FEHLER: Erwartet 16 neue Supermarkt-Vorschauen (8 Einzel + 8 Grid), gefunden: $COUNT"
            exit 1
          fi

      - name: V14.5 Supermarkt Vorlagen einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-5/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-5/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-5/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-5/payload/client/src/data/pixva/v12/templateEngineV12.js client/src/data/pixva/v12/templateEngineV12.js
          cp /tmp/pixva-v14-5/payload/client/src/data/pixva/v12/marketStyles.js client/src/data/pixva/v12/marketStyles.js

          mkdir -p client/public/templates/pixva-market-v14
          cp /tmp/pixva-v14-5/payload/client/public/templates/pixva-market-v14/*.svg client/public/templates/pixva-market-v14/

          mkdir -p client/public/templates/pixva-v12
          cp /tmp/pixva-v14-5/payload/client/public/templates/pixva-v12/v12-supermarkt-einzel.svg client/public/templates/pixva-v12/v12-supermarkt-einzel.svg
          cp /tmp/pixva-v14-5/payload/client/public/templates/pixva-v12/v12-supermarkt-6er.svg client/public/templates/pixva-v12/v12-supermarkt-6er.svg
          cp /tmp/pixva-v14-5/payload/client/public/templates/pixva-v12/v12-supermarkt-9er.svg client/public/templates/pixva-v12/v12-supermarkt-9er.svg

      - name: Acht Supermarkt Stile prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > /tmp/pixva-v14-5-style-test.mjs
          node /tmp/pixva-v14-5-style-test.mjs

          for id in red-cream mustard-green forest-lime blue-lime burgundy-gold charcoal-green red-blue teal-orange; do
            test -f "client/public/templates/pixva-market-v14/$id-single.svg"
            test -f "client/public/templates/pixva-market-v14/$id-grid.svg"
            echo "OK: $id"
          done

      - name: Gerade und postfertige Ausgabe technisch prüfen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          engine=Path("client/src/data/pixva/v12/templateEngineV12.js").read_text(encoding="utf-8")
          editor=Path("client/src/components/DesignEditorLegacy.jsx").read_text(encoding="utf-8")

          required_engine=[
            "marketPalette",
            "lockRotation=true",
            "object.angle=0",
            "object.fontStyle='normal'",
            "market_grid6",
            "market_grid9",
            "market_single"
          ]
          for token in required_engine:
              if token not in engine:
                  raise SystemExit("FEHLER: Gerade Supermarkt-Ausgabe fehlt: "+token)

          required_editor=[
            "preparePostReadyCanvas",
            "slot-label|text-replace-mask|editor-guide|editor-grid",
            "object.stroke='transparent'",
            "Supermarkt-Stil",
            "pixvaMarketStyles.map",
            "keine eingebettete Schrift, keine Preise, keine Logos, keine schrägen Elemente"
          ]
          for token in required_editor:
              if token not in editor:
                  raise SystemExit("FEHLER: Postready-Logik fehlt: "+token)

          print("OK: AI-Supermarkt-Layout wird gerade erzeugt.")
          print("OK: Export entfernt Platzhalter/Raster-Hilfen.")
          print("OK: KI-Produktbildprompt verlangt keine eingebettete Schrift oder Preise.")
          PY

      - name: Flyer Hard Switch erhalten prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "resolveOfferFlyerPrompt" client/src/components/Chat.jsx
          grep -Fq "generateOfferFlyerMessage" client/src/components/Chat.jsx
          grep -Fq "extractOfferDraft" client/src/pixva-offer.js
          grep -Fq "companyType = /" client/src/pixva-offer.js
          grep -Fq "v12-supermarkt-einzel" client/src/components/DesignEditorLegacy.jsx

          echo "OK: Supermarkt-Angebote gehen weiterhin direkt in den bearbeitbaren Flyer."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check client/src/data/pixva/v12/marketStyles.js
          node --check client/src/data/pixva/v12/templateEngineV12.js
          node --check client/src/pixva-offer.js

          rm -rf /tmp/pixva-v14-5-ts
          npm install --prefix /tmp/pixva-v14-5-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-5-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');
          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},
              reportDiagnostics:true,
              fileName:file
            });
            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){
              console.error("JSX FEHLER:",file);
              for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }
          console.log("PIXVA V14.5 JSX CHECK PASSED");
          NODE

          NODE_PATH=/tmp/pixva-v14-5-ts/node_modules node /tmp/pixva-v14-5-jsx.cjs             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Mehr als 12 Vercel Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          if ! grep -R -Fq "Supermarkt-Stil" client/dist/assets; then
            echo "FEHLER: Neue Supermarkt-Stilauswahl ist nicht im Produktionsbundle."
            exit 1
          fi

          if ! grep -R -Fq "Rot & Creme" client/dist/assets; then
            echo "FEHLER: Neue Supermarkt-Stile sind nicht im Produktionsbundle."
            exit 1
          fi

          echo "PIXVA V14.5 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.5 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.5"
          git config user.email "actions@users.noreply.github.com"

          git add --             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/pixva-offer.js             client/src/data/pixva/v12/templateEngineV12.js             client/src/data/pixva/v12/marketStyles.js             client/public/templates/pixva-market-v14             client/public/templates/pixva-v12/v12-supermarkt-einzel.svg             client/public/templates/pixva-v12/v12-supermarkt-6er.svg             client/public/templates/pixva-v12/v12-supermarkt-9er.svg

          if git diff --cached --quiet; then
            echo "PIXVA V14.5 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.5 Supermarkt Vorlagen gerade lesbar und postfertig"
          git push origin HEAD:main
