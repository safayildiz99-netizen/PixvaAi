name: PIXVA V12 SAFE RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Schutzdateien und Basis prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/Login.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/VideoStudio.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Originales V12 Komplettpaket sicher aus Git holen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v12
          mkdir -p /tmp/pixva-v12

          V12_COMMIT=""
          while read -r c; do
            if git show "$c:.github/workflows/main.yml" > /tmp/v12-candidate.yml 2>/dev/null; then
              if grep -Fq "V12 Komplettpaket vorbereiten" /tmp/v12-candidate.yml \
                 && grep -Fq "/tmp/pixva-v12/payload.tar.gz" /tmp/v12-candidate.yml; then
                V12_COMMIT="$c"
                cp /tmp/v12-candidate.yml /tmp/v12-original-workflow.yml
                break
              fi
            fi
          done < <(git rev-list HEAD~1)

          if [ -z "$V12_COMMIT" ]; then
            echo "FEHLER: Das originale PIXVA-V12-Komplettpaket wurde im Git-Verlauf nicht gefunden."
            exit 1
          fi

          echo "Originale V12 Basis gefunden: $V12_COMMIT"

          python - <<'PY'
          from pathlib import Path
          import base64, re

          text = Path('/tmp/v12-original-workflow.yml').read_text(encoding='utf-8')
          patterns = [
              r"echo\s+'([A-Za-z0-9+/=]+)'\s*\|\s*base64\s+--decode\s*>\s*/tmp/pixva-v12/payload\.tar\.gz",
              r'echo\s+"([A-Za-z0-9+/=]+)"\s*\|\s*base64\s+--decode\s*>\s*/tmp/pixva-v12/payload\.tar\.gz',
          ]

          blob = None
          for pattern in patterns:
              m = re.search(pattern, text)
              if m:
                  blob = m.group(1)
                  break

          if not blob:
              raise SystemExit('V12 Payload im originalen Workflow nicht gefunden.')

          data = base64.b64decode(blob, validate=True)
          if not data.startswith(b'\x1f\x8b'):
              raise SystemExit('V12 Payload ist kein gültiges gzip Archiv.')

          Path('/tmp/pixva-v12/payload.tar.gz').write_bytes(data)
          print('Originales V12 Payload wiederhergestellt.')
          PY

          tar -tzf /tmp/pixva-v12/payload.tar.gz >/dev/null
          tar -xzf /tmp/pixva-v12/payload.tar.gz -C /tmp/pixva-v12

          test -f /tmp/pixva-v12/payload/apply-pixva-v12.py
          test -f /tmp/pixva-v12/payload/client/src/data/pixva/v12/catalog.js
          test -f /tmp/pixva-v12/payload/client/src/data/pixva/v12/templateEngineV12.js

          python -m py_compile /tmp/pixva-v12/payload/apply-pixva-v12.py
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/catalog.js
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/templateEngineV12.js

          python - <<'PY'
          import glob, json

          files = glob.glob('/tmp/pixva-v12/payload/client/src/data/pixva/v12/templates/*.json')
          assert len(files) == 12, f'Erwartet 12 Templates, gefunden: {len(files)}'

          data = [json.load(open(f, encoding='utf-8')) for f in files]
          assert len({d['id'] for d in data}) == 12
          assert len({d['layout'] for d in data}) == 12
          print('12 Template-Dateien und 12 verschiedene Layout-IDs OK.')
          PY

          test "$(find /tmp/pixva-v12/payload/client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

      - name: V12 Galeriefehler korrekt reparieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          patcher = Path('/tmp/pixva-v12/payload/apply-pixva-v12.py')
          src = patcher.read_text(encoding='utf-8')
          error_text = "DesignEditor: Galerie nicht gefunden."

          if error_text not in src:
              raise SystemExit('Der bekannte V12 Galerie-Schutzpunkt wurde nicht gefunden.')

          marker = '# PIXVA V12 SAFE RECOVERY GALLERY'
          if marker not in src:
              pos = src.find(error_text)
              line_start = src.rfind('\n', 0, pos) + 1
              line_end = src.find('\n', line_start)
              if line_end < 0:
                  line_end = len(src)

              old_line = src[line_start:line_end]
              indent = old_line[:len(old_line) - len(old_line.lstrip())]

              if 'raise ' not in old_line:
                  raise SystemExit('Unerwartete Galerie-Fehlerzeile im V12 Patcher.')

              block = r'''# PIXVA V12 SAFE RECOVERY GALLERY
          # Wir befinden uns bereits im ursprünglichen "Galerie nicht gefunden"-Zweig.
          # Erst mehrere echte Strukturen probieren; NUR wenn danach nichts passt, abbrechen.
          _candidates = []
          
          for _needle in (
              'className="template-gallery"',
              "className='template-gallery'",
              'className="tool-grid"',
              "className='tool-grid'",
              'className="template-grid"',
              "className='template-grid'",
              'pixvaTemplateList.map',
              'applyPixvaFileTemplate(',
              'applyTemplate(',
              'Vorlagenmodus',
              'Vorlagen',
          ):
              _p = s.find(_needle)
              if _p >= 0:
                  _candidates.append((_p, _needle))
          
          def _match_tag_region(_text, _anchor):
              _opens = []
              for _tag in ('div', 'section', 'article', 'aside'):
                  _o = _text.rfind('<' + _tag, 0, _anchor + 1)
                  if _o >= 0:
                      _opens.append((_o, _tag))
              if not _opens:
                  return None, None
          
              _open, _tag = max(_opens, key=lambda x: x[0])
              _scan = _open
              _depth = 0
              _open_token = '<' + _tag
              _close_token = '</' + _tag + '>'
          
              while _scan < len(_text):
                  _next_open = _text.find(_open_token, _scan)
                  _next_close = _text.find(_close_token, _scan)
          
                  if _next_close < 0:
                      return None, None
          
                  if _next_open >= 0 and _next_open < _next_close:
                      _depth += 1
                      _scan = _next_open + len(_open_token)
                  else:
                      _depth -= 1
                      _scan = _next_close + len(_close_token)
                      if _depth == 0:
                          return _open, _scan
          
              return None, None
          
          for _anchor, _needle in _candidates:
              _a, _b = _match_tag_region(s, _anchor)
              if _a is None or _b is None or _b <= _a:
                  continue
          
              if _needle in ('Vorlagenmodus', 'Vorlagen'):
                  _label = s.rfind('<label', max(0, _a - 3000), _a)
                  if _label >= 0:
                      _a = _label
          
              start, end = _a, _b
              break
          
          if start is None or end is None:
              raise RuntimeError('DesignEditor: Galerie nicht gefunden.')
          '''
              block = ''.join(indent + line + '\n' for line in block.splitlines())
              src = src[:line_start] + block + src[line_end + (1 if line_end < len(src) else 0):]
              patcher.write_text(src, encoding='utf-8')

          print('Unbedingter Galerie-Abbruch wurde durch echten bedingten Recovery-Fallback ersetzt.')
          PY

          python -m py_compile /tmp/pixva-v12/payload/apply-pixva-v12.py

      - name: V12 zuerst schnell gegen echten Code und Git Historie testen
        shell: bash
        run: |
          set -euo pipefail

          PROBE=/tmp/pixva-v12-probe
          rm -rf "$PROBE"
          git worktree add --detach "$PROBE" "$GITHUB_SHA" >/dev/null

          cleanup() {
            git worktree remove -f "$PROBE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          {
            echo CURRENT
            git log --format=%H --follow -- client/src/components/DesignEditorLegacy.jsx | head -n 30
          } | awk '!seen[$0]++' > /tmp/v12-editor-candidates.txt

          FOUND=""
          TRY=0

          while read -r CANDIDATE; do
            [ -n "$CANDIDATE" ] || continue
            TRY=$((TRY + 1))

            git -C "$PROBE" reset --hard "$GITHUB_SHA" >/dev/null
            git -C "$PROBE" clean -fdx >/dev/null

            if [ "$CANDIDATE" != "CURRENT" ]; then
              if ! git show "$CANDIDATE:client/src/components/DesignEditorLegacy.jsx" > "$PROBE/client/src/components/DesignEditorLegacy.jsx" 2>/dev/null; then
                continue
              fi
            fi

            echo "V12 Schnelltest $TRY: $CANDIDATE"

            if (cd "$PROBE" && python /tmp/pixva-v12/payload/apply-pixva-v12.py > "/tmp/v12-probe-$TRY.log" 2>&1); then
              if grep -Fq "PIXVA V12 ALL IN ONE EDITOR" "$PROBE/client/src/components/DesignEditorLegacy.jsx" \
                 && grep -Fq "PIXVA V12 TEMPLATE GALLERY" "$PROBE/client/src/components/DesignEditorLegacy.jsx" \
                 && grep -Fq "applyPixvaV12Template" "$PROBE/client/src/components/DesignEditorLegacy.jsx"; then
                FOUND="$CANDIDATE"
                echo "Passende echte Editor-Basis gefunden: $FOUND"
                break
              fi
            fi

            echo "Schnelltest nicht passend; kein langer Build gestartet."
            tail -n 12 "/tmp/v12-probe-$TRY.log" 2>/dev/null || true
          done < /tmp/v12-editor-candidates.txt

          if [ -z "$FOUND" ]; then
            echo "FEHLER: Keine der letzten 30 echten DesignEditor-Versionen konnte vom originalen V12-Paket vollständig gepatcht werden."
            echo "Es wurde NICHT installiert, NICHT gebaut und NICHT gepusht."
            exit 1
          fi

          printf '%s' "$FOUND" > /tmp/v12-editor-source

          cleanup
          trap - EXIT

      - name: V12 alles in einem wirklich einsetzen
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(cat /tmp/v12-editor-source)"
          echo "Verwendete Editor-Basis: $SOURCE"

          if [ "$SOURCE" != "CURRENT" ]; then
            git show "$SOURCE:client/src/components/DesignEditorLegacy.jsx" > client/src/components/DesignEditorLegacy.jsx
          fi

          python /tmp/pixva-v12/payload/apply-pixva-v12.py

      - name: V12 Funktionen vor langem Build streng prüfen
        shell: bash
        run: |
          set -euo pipefail

          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "recommendPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "runPixvaV12Audit" client/src/components/DesignEditorLegacy.jsx

          grep -Fq "PIXVA V12 LOGIN ACCOUNT TYPES" client/src/components/Login.jsx
          grep -Fq 'value="programmierer"' client/src/components/Login.jsx

          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "function resolveType(base,extra)" client/src/components/AdminAccounts.jsx
          test "$(grep -Fc 'function resolveType(base,extra)' client/src/components/AdminAccounts.jsx)" -eq 1

          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx

          node --check client/src/data/pixva/v12/catalog.js
          node --check client/src/data/pixva/v12/templateEngineV12.js

          python - <<'PY'
          import glob, json
          files = glob.glob('client/src/data/pixva/v12/templates/*.json')
          assert len(files) == 12
          data = [json.load(open(f, encoding='utf-8')) for f in files]
          assert len({d['id'] for d in data}) == 12
          assert len({d['layout'] for d in data}) == 12
          print('Installierte V12 JSON-Vorlagen vollständig und eindeutig.')
          PY

      - name: Gepatchtes JSX vor npm Build prüfen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/check-jsx.cjs <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');

          for (const file of process.argv.slice(2)) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext
              },
              reportDiagnostics: true,
              fileName: file
            });

            const errors = (result.diagnostics || []).filter(
              d => d.category === ts.DiagnosticCategory.Error
            );

            if (errors.length) {
              console.error('JSX FEHLER:', file);
              for (const d of errors) {
                console.error(ts.flattenDiagnosticMessageText(d.messageText, ' '));
              }
              process.exit(1);
            }
          }

          console.log('V12 gepatchtes JSX syntaktisch OK.');
          NODE

          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-jsx.cjs \
            client/src/components/DesignEditorLegacy.jsx \
            client/src/components/Login.jsx \
            client/src/components/AdminAccounts.jsx \
            client/src/components/VideoStudio.jsx \
            client/src/components/WebsiteBuilder.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build erst nach allen Schnelltests
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: V12 nach Build nochmals prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

      - name: Workflow behalten
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur vollständig erfolgreichen V12 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V12"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "PIXVA V12 ist bereits vollständig installiert."
            exit 0
          fi

          git commit -m "PIXVA V12 Safe Recovery"
          git push origin HEAD:main
