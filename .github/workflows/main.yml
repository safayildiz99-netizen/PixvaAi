name: PIXVA V14.6.1 AUSBLENDEN PARSER UND PRODUKTBILD FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/pixva.js
          test -f client/src/App.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/pixva-product-match.js

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.6.1 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-6-1
          mkdir -p /tmp/pixva-v14-6-1/payload

          echo '' | base64 --decode > /tmp/pixva-v14-6-1/payload.tar.gz
          tar -xzf /tmp/pixva-v14-6-1/payload.tar.gz -C /tmp/pixva-v14-6-1/payload

          COUNT="$(find /tmp/pixva-v14-6-1/payload -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 6 ]; then
            echo "FEHLER: Paket unvollständig. Erwartet 6 Dateien, gefunden $COUNT."
            exit 1
          fi

      - name: V14.6.1 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-6-1/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-6-1/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-6-1/payload/client/src/components/AdminLegacy.jsx client/src/components/AdminLegacy.jsx
          cp /tmp/pixva-v14-6-1/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-6-1/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-6-1/payload/client/src/pixva-product-match.js client/src/pixva-product-match.js

      - name: Istanbul Bazar ohne Leerzeichen exakt testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractOfferDraft} from './client/src/pixva-offer.js';

          const text='erstelle mir einen flyer für den istanbul bazar mit dem produftÜlker Gofret mit dem preis von 1,99€ zur 0,99€';
          const d=extractOfferDraft(text);

          if(d.companyName.toLowerCase()!=='istanbul bazar')throw new Error('Firma falsch: '+d.companyName);
          if(d.companyType!=='supermarkt')throw new Error('Istanbul Bazar wurde nicht als Supermarkt erkannt.');
          if(d.productName.toLowerCase()!=='ülker gofret')throw new Error('Produkt falsch: '+d.productName);
          if(d.oldPrice!=='1,99 €')throw new Error('Alter Preis falsch: '+d.oldPrice);
          if(d.newPrice!=='0,99 €')throw new Error('Neuer Preis falsch: '+d.newPrice);
          if(d.discountPercent!==50)throw new Error('Rabatt falsch: '+d.discountPercent);

          console.log('OK: produftÜlker ohne Leerzeichen wird korrekt geparst.');
          NODE

      - name: Egetürk falsche Varianten blockieren
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {isExactProductCandidate} from './client/src/pixva-product-match.js';

          const wanted='Egetürk Sucuk Dilim';

          if(isExactProductCandidate({title:'Egetürk EGEM Dilim Sucuk'},wanted,.66))
            throw new Error('EGEM wurde fälschlich akzeptiert.');

          if(isExactProductCandidate({title:'Egetürk Vegan Dilim Sucuk'},wanted,.66))
            throw new Error('Vegan wurde fälschlich akzeptiert.');

          if(!isExactProductCandidate({title:'Egetürk Sucuk Dilim Classic Original'},wanted,.66))
            throw new Error('Classic/Original wurde nicht akzeptiert.');

          if(!isExactProductCandidate({title:'Ülker Çikolatalı Gofret'},'Ülker Gofret',.66))
            throw new Error('Ülker Gofret wurde nicht akzeptiert.');

          console.log('OK: EGEM blockiert.');
          console.log('OK: Vegan blockiert.');
          console.log('OK: Classic/Original akzeptiert.');
          console.log('OK: Ülker Gofret akzeptiert.');
          NODE

      - name: Ausblenden Speicherweg prüfen
        shell: bash
        run: |
          set -euo pipefail

          check() {
            FILE="$1"
            TEXT="$2"
            LABEL="$3"
            if ! grep -Fq -- "$TEXT" "$FILE"; then
              echo "FEHLER: $LABEL"
              echo "Datei: $FILE"
              exit 1
            fi
            echo "OK: $LABEL"
          }

          check api/pixva.js "app_get_ui_settings" "Vorlagen lesen aus demselben globalen UI-Settings-Speicher."
          check api/pixva.js "app_admin_save_ui_settings" "Ausblenden speichert über den bestehenden Admin-Settings-RPC."
          check api/pixva.js "templateConfig:config" "templateConfig wird im globalen UI-Setting gespeichert."
          check api/pixva.js "pixvaTemplateConfig:config" "Legacy-Spiegelung bleibt kompatibel."

          check client/src/components/AdminLegacy.jsx "const optimistic=normalizeSettings" "Ausblenden aktualisiert die Oberfläche sofort."
          check client/src/components/AdminLegacy.jsx "Vorlage konnte nicht gespeichert werden" "Fehler wird sichtbar gemeldet statt still ignoriert."
          check client/src/App.jsx "const current=prev?.templateConfig" "Leere Serverantwort überschreibt keine aktive Vorlagenkonfiguration."

      - name: Produktbild Suche mehrfach prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '`${draft.productName} Produktfoto kaufen`' client/src/components/Chat.jsx
          grep -Fq 'exactCandidates=rawCandidates.filter' client/src/components/Chat.jsx
          grep -Fq "isExactProductCandidate" client/src/components/Chat.jsx

          echo "OK: Bei keinem exakten Treffer wird automatisch eine zweite gezielte Suche durchgeführt."
          echo "OK: Eingesetzt werden weiterhin nur ausreichend exakte Produktbilder."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/pixva.js
          node --check client/src/pixva-offer.js
          node --check client/src/pixva-product-match.js

          rm -rf /tmp/pixva-v14-6-1-ts
          npm install --prefix /tmp/pixva-v14-6-1-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-6-1-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');

          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{
                jsx:ts.JsxEmit.ReactJSX,
                target:ts.ScriptTarget.ES2022,
                module:ts.ModuleKind.ESNext
              },
              reportDiagnostics:true,
              fileName:file
            });

            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);

            if(errors.length){
              console.error('JSX FEHLER:',file);
              for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }

          console.log('PIXVA V14.6.1 JSX CHECK PASSED');
          NODE

          NODE_PATH=/tmp/pixva-v14-6-1-ts/node_modules node /tmp/pixva-v14-6-1-jsx.cjs \
            client/src/App.jsx \
            client/src/components/AdminLegacy.jsx \
            client/src/components/Chat.jsx

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          if ! grep -R -Fq "Vorlage konnte nicht gespeichert werden" client/dist/assets; then
            echo "FEHLER: Neuer Ausblenden-Speicherweg fehlt im Produktionsbundle."
            exit 1
          fi

          echo "PIXVA V14.6.1 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.6.1 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.6.1"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            api/pixva.js \
            client/src/App.jsx \
            client/src/components/AdminLegacy.jsx \
            client/src/components/Chat.jsx \
            client/src/pixva-offer.js \
            client/src/pixva-product-match.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.6.1 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.6.1 Ausblenden Parser und Produktbild fixen"
          git push origin HEAD:main
