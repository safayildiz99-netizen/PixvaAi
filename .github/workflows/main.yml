name: PIXVA V11.2 Konten Profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PayPal Preise Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.2 Patch vorbereiten
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply-v11-2.py
          python -m py_compile /tmp/apply-v11-2.py

      - name: Konten Profile einbauen
        shell: bash
        run: |
          python /tmp/apply-v11-2.py

      - name: Schutz prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: V11.2 prüfen
        shell: bash
        run: |
          grep -Fq "action==='team-create'" api/pixva.js
          grep -Fq "app_create_user_profile" api/pixva.js
          grep -Fq "Neues Konto erstellen" client/src/components/PixvaCenter.jsx
          grep -Fq "E-Mail <small>optional</small>" client/src/components/PixvaCenter.jsx
          grep -Fq "Telefon <small>optional</small>" client/src/components/PixvaCenter.jsx
          node --check api/pixva.js

      - name: Produktions Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA V11.2 Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.2 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.2 Konten und Profile"
          git push origin HEAD:main
