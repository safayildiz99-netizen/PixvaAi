name: PIXVA V14.3 NUR ADMIN UND KUNDEN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-offer.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.3 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-3
          mkdir -p /tmp/pixva-v14-3/payload

          echo '' | base64 --decode > /tmp/pixva-v14-3/payload.tar.gz
          tar -xzf /tmp/pixva-v14-3/payload.tar.gz -C /tmp/pixva-v14-3/payload

          test -f /tmp/pixva-v14-3/payload/client/src/components/AdminAccounts.jsx
          test -f /tmp/pixva-v14-3/payload/client/src/pixva-offer.js

      - name: V14.3 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf api/v1

          cp /tmp/pixva-v14-3/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-3/payload/client/src/api.js client/src/api.js
          cp /tmp/pixva-v14-3/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-3/payload/client/src/components/Login.jsx client/src/components/Login.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/AdminLegacy.jsx client/src/components/AdminLegacy.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/AdminAccounts.jsx client/src/components/AdminAccounts.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/WebsiteBuilder.jsx client/src/components/WebsiteBuilder.jsx
          cp /tmp/pixva-v14-3/payload/client/src/components/VideoStudio.jsx client/src/components/VideoStudio.jsx
          cp /tmp/pixva-v14-3/payload/client/src/data/pixva/v12/templateEngineV12.js client/src/data/pixva/v12/templateEngineV12.js
          cp /tmp/pixva-v14-3/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-3/payload/api/ai/admin-accounts.js api/ai/admin-accounts.js
          cp /tmp/pixva-v14-3/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-3/payload/api/public.js api/public.js
          cp /tmp/pixva-v14-3/payload/lib/pixva-brain.js lib/pixva-brain.js
          cp /tmp/pixva-v14-3/payload/vercel.json vercel.json

      - name: Kontenaufteilung exakt prüfen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          text=Path("client/src/components/AdminAccounts.jsx").read_text(encoding="utf-8")

          required=[
            "['1 · Admin',accounts.filter(a=>a.role==='admin')]",
            "['2 · Kunden',accounts.filter(a=>a.role!=='admin')]",
            "a.role==='admin'?'Admin':'Kunde'"
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit("FEHLER: Neue Admin/Kunden-Aufteilung fehlt: "+needle)

          forbidden=[
            "Firmenkonten · vom Admin erstellt",
            "Firmenkonten · selbst registriert",
            "Firmenkonten · Bestand/System",
            "Kunden-/Privatkonten · vom Admin erstellt",
            "Kunden-/Privatkonten · selbst registriert",
            "Kunden-/Privatkonten · Bestand/System"
          ]
          found=[x for x in forbidden if x in text]
          if found:
              raise SystemExit("FEHLER: Alte Kontengruppen sind noch vorhanden: "+", ".join(found))

          print("OK: Im Admin gibt es nur noch Admin und Kunden.")
          PY

      - name: Flyer Hard Switch weiter prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > /tmp/pixva-v14-3-offer-test.mjs
          node /tmp/pixva-v14-3-offer-test.mjs

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"
          test "$COUNT" -le 12
          test ! -d api/v1

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          TEMPLATES="$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          PREVIEWS="$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"
          test "$TEMPLATES" -eq 12
          test "$PREVIEWS" -eq 12
          echo "PIXVA V14.3 FINAL CHECK PASSED"

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.3"
          git config user.email "actions@users.noreply.github.com"

          git add --             client/src/App.jsx             client/src/api.js             client/src/pixva-offer.js             client/src/components/Login.jsx             client/src/components/AdminLegacy.jsx             client/src/components/AdminAccounts.jsx             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/components/WebsiteBuilder.jsx             client/src/components/VideoStudio.jsx             client/src/data/pixva/v12/templateEngineV12.js             api/ai/image-search.js             api/ai/admin-accounts.js             api/pixva.js             api/public.js             lib/pixva-brain.js             vercel.json

          if git ls-files 'api/v1/**' | grep -q .; then
            git add -u -- api/v1
          fi

          if git diff --cached --quiet; then
            echo "PIXVA V14.3 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.3 Admin und Kunden vereinfachen"
          git push origin HEAD:main
