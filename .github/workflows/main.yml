name: PIXVA V13.1.1 VERCEL FINAL FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V13 Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/pixva-api-keys.js
          test -f lib/pixva-brain.js
          test -f api/pixva.js
          test -f api/ai/chat.js
          test -f api/ai/image.js
          test -f api/ai/video.js
          test -f vercel.json

          grep -Fq "api-key-create" api/pixva.js
          grep -Fq "authenticatePixvaApiKey" lib/pixva-api-keys.js

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Getesteten V13.1 Hobby Fix vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v13-1
          mkdir -p /tmp/pixva-v13-1/payload

          echo '' | base64 --decode > /tmp/pixva-v13-1/fix.tar.gz
          tar -tzf /tmp/pixva-v13-1/fix.tar.gz > /tmp/pixva-v13-1/files.txt

          test "$(wc -l < /tmp/pixva-v13-1/files.txt | tr -d ' ')" -eq 2
          grep -Fxq "api/public.js" /tmp/pixva-v13-1/files.txt
          grep -Fxq "vercel.json" /tmp/pixva-v13-1/files.txt

          tar -xzf /tmp/pixva-v13-1/fix.tar.gz -C /tmp/pixva-v13-1/payload

          node --check /tmp/pixva-v13-1/payload/api/public.js
          python -m json.tool /tmp/pixva-v13-1/payload/vercel.json >/dev/null

      - name: V13 Public API auf eine Function zusammenfassen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf api/v1
          cp /tmp/pixva-v13-1/payload/api/public.js api/public.js
          cp /tmp/pixva-v13-1/payload/vercel.json vercel.json

          node --check api/public.js
          python -m json.tool vercel.json >/dev/null

          test ! -d api/v1
          grep -Fq '"/api/v1/(status|brain|chat|blueprint|image|video)"' vercel.json
          grep -Fq '"/api/public?endpoint=$1"' vercel.json

      - name: Vercel Hobby Function Limit vor Build prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploybare API Functions:"
          find api -type f -name '*.js' ! -name '_*.js' -print | sort

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "PIXVA deploybare Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby Limit wäre weiterhin überschritten."
            exit 1
          fi

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: $COUNT deploybare Functions gefunden. Maximal 12 erlaubt."
            exit 1
          fi
          echo "OK: $COUNT deploybare Functions – innerhalb des Hobby-Limits."

      - name: Zusammengefasste Public API lokal testen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > pixva-v13-1-public-api-test.mjs
          node pixva-v13-1-public-api-test.mjs
          rm pixva-v13-1-public-api-test.mjs

      - name: V13.1.1 Kernfunktionen eindeutig prüfen
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            if [ ! -f "$1" ]; then
              echo "FEHLER: Benötigte Datei fehlt: $1"
              exit 1
            fi
            echo "OK: $1"
          }

          check_file api/public.js
          check_file lib/pixva-api-keys.js
          check_file lib/pixva-brain.js
          check_file lib/pixva-provider-routing.js
          check_file api/ai/chat.js
          check_file api/ai/image.js
          check_file api/ai/video.js

          if [ -d api/v1 ]; then
            echo "FEHLER: api/v1 existiert noch und würde wieder zusätzliche Vercel Functions erzeugen."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          text = Path("api/public.js").read_text(encoding="utf-8")
          required = ["status", "brain", "chat", "blueprint", "image", "video"]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("FEHLER: Public API Endpunkte fehlen: " + ", ".join(missing))
          if "authenticatePixvaApiKey" not in text:
              raise SystemExit("FEHLER: API-Key-Authentifizierung fehlt.")
          if "confirmCost" not in text:
              raise SystemExit("FEHLER: Kostenfreigabe für Medien fehlt.")
          print("OK: Public API, API-Key-Authentifizierung und Kostenfreigabe vorhanden.")
          PY

          TEMPLATES="$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          PREVIEWS="$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"

          if [ "$TEMPLATES" -ne 12 ]; then
            echo "FEHLER: Erwartet 12 V12 Templates, gefunden: $TEMPLATES"
            exit 1
          fi
          if [ "$PREVIEWS" -ne 12 ]; then
            echo "FEHLER: Erwartet 12 V12 Previews, gefunden: $PREVIEWS"
            exit 1
          fi

          echo "OK: 12 Templates und 12 Previews vorhanden."

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nur vollständig erfolgreichen V13.1 Fix veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: $COUNT deploybare Functions gefunden. Maximal 12 erlaubt."
            exit 1
          fi
          echo "OK: $COUNT deploybare Functions – innerhalb des Hobby-Limits."

          git config user.name "PIXVA V13.1"
          git config user.email "actions@users.noreply.github.com"

          git add -A api vercel.json

          if git diff --cached --quiet; then
            echo "PIXVA V13.1.1 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V13.1.1 Vercel Hobby Final Fix"
          git push origin HEAD:main
