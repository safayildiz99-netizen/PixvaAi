name: PIXVA V11.9.5 TEMPLATE CLICK SYNTAX FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen Stand und Schutz prüfen
        shell: bash
        run: |
          set -e
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/data/pixva/flyerTemplateEngine.js
          test -f client/src/data/pixva/flyer_vorlagen.json
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          grep -Fq "async function applyTemplate(type)" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "async function renderJsonData(json)" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "pixvaTemplateList.map((template)" client/src/components/DesignEditorLegacy.jsx
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.9.5 Payload prüfen
        shell: bash
        run: |
          set -e
          echo '' | base64 --decode > /tmp/apply-pixva-v11-9-5.py
          python -m py_compile /tmp/apply-pixva-v11-9-5.py

      - name: Vorlagen-Klick sauber einsetzen
        shell: bash
        run: |
          set -e
          python /tmp/apply-pixva-v11-9-5.py

      - name: Gepatchten JSX Code vollständig prüfen
        shell: bash
        run: |
          set -e

          if grep -Fq '\nimport { applyPixvaFileTemplate' client/src/components/DesignEditorLegacy.jsx; then
            echo "FEHLER: wörtliches backslash-n vor dem Import gefunden."
            exit 1
          fi

          IMPORT_COUNT=$(grep -Fc "../data/pixva/flyerTemplateEngine.js" client/src/components/DesignEditorLegacy.jsx)
          if [ "$IMPORT_COUNT" -ne 1 ]; then
            echo "FEHLER: Template-Engine Importanzahl ist $IMPORT_COUNT statt 1."
            exit 1
          fi

          grep -Fq "PIXVA V11.9.5 TEMPLATE CLICK SYNTAX FIX" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "await resolvePixvaTemplateBrand();" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "await applyPixvaFileTemplate(" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "pixvaTemplateList.find((item) => item.id === type)" client/src/components/DesignEditorLegacy.jsx

          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts
          echo '' | base64 --decode > /tmp/check-patched-jsx.cjs
          node --check /tmp/check-patched-jsx.cjs
          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-patched-jsx.cjs             client/src/components/DesignEditorLegacy.jsx

      - name: PayPal Preise und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -e
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          set -e
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -e
          git config user.name "PIXVA V11.9.5"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.9.5 bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.9.5 Template Click Syntax Fix"
          git push origin HEAD:main
