name: PIXVA V10.1 Render FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geldsystem und PIXVA Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          echo "0442e6d061d1564b95aa8accf954fba3ec6410b9820706b6659f528bf1f093ef  client/public/pixva-logo.png" | sha256sum -c -

      - name: V10.1 Dateien vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v10-payload
          mkdir -p /tmp/pixva-v10-payload
          mkdir -p "$(dirname '/tmp/pixva-v10-payload/api/pixva.js')"
          echo '' | base64 --decode > '/tmp/pixva-v10-payload/api/pixva.js'
          mkdir -p "$(dirname '/tmp/pixva-v10-payload/client/src/components/PixvaCenter.jsx')"
          echo '' | base64 --decode > '/tmp/pixva-v10-payload/client/src/components/PixvaCenter.jsx'
          mkdir -p "$(dirname '/tmp/pixva-v10-payload/client/src/components/PixvaCenter.css')"
          echo '' | base64 --decode > '/tmp/pixva-v10-payload/client/src/components/PixvaCenter.css'
          mkdir -p "$(dirname '/tmp/pixva-v10-payload/client/public/pixva-recovery.html')"
          echo '' | base64 --decode > '/tmp/pixva-v10-payload/client/public/pixva-recovery.html'
          mkdir -p "$(dirname '/tmp/pixva-v10-payload/supabase/PIXVA-V10-COMPLETE.sql')"
          echo '' | base64 --decode > '/tmp/pixva-v10-payload/supabase/PIXVA-V10-COMPLETE.sql'
          echo '' | base64 --decode > /tmp/apply-pixva-v10-1.py
          python -m py_compile /tmp/apply-pixva-v10-1.py

      - name: PIXVA V10.1 installieren
        shell: bash
        run: |
          python /tmp/apply-pixva-v10-1.py

      - name: Änderungen prüfen
        shell: bash
        run: |
          grep -Fq "id:'pixva'" client/src/App.jsx
          grep -Fq "<PixvaCenter" client/src/App.jsx
          grep -Fq "PIXVA KI-Zentrale" client/src/App.jsx
          grep -Fq "path.startsWith('/api/pixva')" client/src/api.js
          grep -Fq "PIXVA AUTOSAVE V10" client/src/components/DesignEditor.jsx
          test -f api/pixva.js
          test -f client/src/components/PixvaCenter.jsx
          test -f client/src/components/PixvaCenter.css
          echo "PIXVA Hub und V10-Komponenten vorhanden."

      - name: Geldsystem unverändert prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          echo "0442e6d061d1564b95aa8accf954fba3ec6410b9820706b6659f528bf1f093ef  client/public/pixva-logo.png" | sha256sum -c -
          grep -Fq "PAYMENT.CAPTURE.COMPLETED" api/billing.js
          echo "PayPal, Abos und Logo unverändert."

      - name: Abhängigkeiten und Servercode prüfen
        shell: bash
        run: |
          npm install
          node --check api/pixva.js
          node --check api/billing.js
          node --check api/ai/image.js
          node --check api/ai/video.js
          COUNT=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "API JavaScript Dateien: $COUNT"
          if [ "$COUNT" -gt 12 ]; then
            echo "Zu viele Vercel-Funktionen für den vorhandenen Aufbau."
            exit 1
          fi

      - name: Produktions-Build
        shell: bash
        run: |
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/pixva-v10-1-main.yml
          mkdir -p .github/workflows
          cp /tmp/pixva-v10-1-main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V10.1 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V10.1 Complete AI Suite Render Fix"
          git push origin HEAD:main
