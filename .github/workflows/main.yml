name: PIXVA V14.7.2 LOGO CHECK FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f api/pixva.js
          test -f api/ai/image-search.js
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/pixva-product-match.js
          test -f client/src/data/pixva/v12/templateEngineV12.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.7 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-v14-7
          mkdir -p /tmp/pixva-v14-7/payload
          echo '' | base64 --decode > /tmp/pixva-v14-7/payload.tar.gz
          tar -xzf /tmp/pixva-v14-7/payload.tar.gz -C /tmp/pixva-v14-7/payload

          COUNT="$(find /tmp/pixva-v14-7/payload -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 5 ]; then
            echo "FEHLER: V14.7 Paket unvollständig: $COUNT / 5 Dateien."
            exit 1
          fi

      - name: V14.7 einsetzen
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pixva-v14-7/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-7/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-7/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-7/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-7/payload/client/src/pixva-multi-offer.js client/src/pixva-multi-offer.js

      - name: Exakten 9er Nutzerauftrag testen
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {extractMultiOfferDraft,looksLikeMultiOfferPrompt} from './client/src/pixva-multi-offer.js';

          const text='erstelle mir ein 9er angebot mit den produkten:Sütdana Kemikli 7,99€ kg ,Kanat incik 3kg 9,99€,Kervan erzincan peynirler 45/55/60 800g 5,99€,Yörem 55/60 800g 3,99€,Birinci 5 litre oliven öl 22,99€,Duru pilavlik pirinc 5kg 8,99€,Marmara baldo 5kg 8,99€,Balkaneeta kupus sauerkreut 1,49€,Öncü cam salcalar 700g 3,99€, für den supermarkt Yaz City';
          if(!looksLikeMultiOfferPrompt(text))throw new Error('9er Auftrag wird nicht als Mehrprodukt-Angebot erkannt.');
          const d=extractMultiOfferDraft(text);
          if(d.companyName!=='Yaz City')throw new Error('Firma falsch: '+d.companyName);
          if(d.templateId!=='v12-supermarkt-9er')throw new Error('Falsche Vorlage: '+d.templateId);
          if(d.products.length!==9)throw new Error('Erwartet 9 Produkte, gefunden '+d.products.length);

          const expected=[
            ['Sütdana Kemikli','7,99 € / kg'],
            ['Kanat incik 3kg','9,99 €'],
            ['Kervan erzincan peynirler 45/55/60 800g','5,99 €'],
            ['Yörem 55/60 800g','3,99 €'],
            ['Birinci 5 litre oliven öl','22,99 €'],
            ['Duru pilavlik pirinc 5kg','8,99 €'],
            ['Marmara baldo 5kg','8,99 €'],
            ['Balkaneeta kupus sauerkreut','1,49 €'],
            ['Öncü cam salcalar 700g','3,99 €']
          ];
          expected.forEach(([name,price],i)=>{
            if(d.products[i]?.productName!==name)throw new Error(`Produkt ${i+1} falsch: ${d.products[i]?.productName}`);
            if(d.products[i]?.newPrice!==price)throw new Error(`Preis ${i+1} falsch: ${d.products[i]?.newPrice}`);
          });
          console.log('PIXVA V14.7 9ER PARSER PASSED');
          NODE

      - name: 9 Produktbilder und 9 Slots prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "generateMultiOfferFlyerMessage" client/src/components/Chat.jsx
          grep -Fq "mapWithConcurrency(multiDraft.products,3" client/src/components/Chat.jsx
          grep -Fq "findVerifiedProductImage(product.productName" client/src/components/Chat.jsx
          grep -Fq 'offerProducts.length>=9' client/src/components/DesignEditorLegacy.jsx
          grep -Fq 'product-title:${slotIndex}' client/src/components/DesignEditorLegacy.jsx
          grep -Fq 'product-slot:${slotIndex}' client/src/components/DesignEditorLegacy.jsx
          grep -Fq 'product-image:${slotIndex}' client/src/components/DesignEditorLegacy.jsx
          echo "OK: 9er Auftrag nutzt 9 getrennte Karten und Bildslots."

      - name: Automatische Supermarkt Logo Suche prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "findVerifiedCompanyLogo" client/src/components/Chat.jsx
          grep -Fq "offizielles Logo PNG" client/src/components/Chat.jsx
          grep -Fq "mode:'logo',source:'web'" client/src/components/Chat.jsx
          grep -Fq "action==='verify-company-logo'" api/pixva.js
          grep -Fq "mode==='logo'" api/ai/image-search.js
          grep -Fq "const google = await searchGoogle(query, mode)" api/ai/image-search.js
          grep -Fq "draft.logoVerified===true" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "logo-image:1" client/src/components/DesignEditorLegacy.jsx
          echo "OK: Google/Web Logo-Suche + Firmenlogo-Prüfung + Logo-Slot vorhanden."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/pixva.js
          node --check api/ai/image-search.js
          node --check client/src/pixva-multi-offer.js
          node --check client/src/pixva-offer.js
          node --check client/src/pixva-product-match.js

          rm -rf /tmp/pixva-v14-7-ts
          npm install --prefix /tmp/pixva-v14-7-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null
          cat > /tmp/pixva-v14-7-jsx.cjs <<'NODE'
          const ts=require('typescript');const fs=require('fs');
          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const r=ts.transpileModule(source,{compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true,fileName:file});
            const errors=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){console.error('JSX FEHLER:',file);for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));process.exit(1);}
          }
          console.log('PIXVA V14.7 JSX PASSED');
          NODE
          NODE_PATH=/tmp/pixva-v14-7-ts/node_modules node /tmp/pixva-v14-7-jsx.cjs \
            client/src/components/Chat.jsx \
            client/src/components/DesignEditorLegacy.jsx

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Mehr als 12 Vercel Functions."
            exit 1
          fi

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d client/dist
          grep -R -Fq "9er-Supermarktangebot vorbereitet" client/dist/assets
          grep -R -Fq "Logo für" client/dist/assets
          echo "PIXVA V14.7 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.7 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PIXVA V14.7.2"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            api/pixva.js \
            api/ai/image-search.js \
            client/src/components/Chat.jsx \
            client/src/components/DesignEditorLegacy.jsx \
            client/src/pixva-multi-offer.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.7.2 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V14.7.2 Logo Check Fix"
          git push origin HEAD:main
