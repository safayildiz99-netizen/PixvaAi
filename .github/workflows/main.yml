name: PIXVA V14.4 SUPERMARKT FLYER FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/data/pixva/v12/templateEngineV12.js
          test -f client/src/data/pixva/v12/catalog.js

          grep -Fq "applyPixvaOfferDraftToCanvas" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "recommendPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "generateOfferFlyerMessage" client/src/components/Chat.jsx
          grep -Fq "extractOfferDraft" client/src/pixva-offer.js
          grep -Fq "marketSingle" client/src/data/pixva/v12/templateEngineV12.js

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V14.4 getestete Dateien einsetzen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > client/src/components/Chat.jsx
          echo '' | base64 --decode > client/src/components/DesignEditorLegacy.jsx
          echo '' | base64 --decode > client/src/pixva-offer.js
          echo '' | base64 --decode > client/src/data/pixva/v12/templateEngineV12.js

      - name: Exakten Yaz Mega Center Auftrag testen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/pixva-v14-4-test.mjs
          node /tmp/pixva-v14-4-test.mjs

      - name: Falsche Service Vorlage technisch ausschließen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          offer=Path("client/src/pixva-offer.js").read_text(encoding="utf-8")
          editor=Path("client/src/components/DesignEditorLegacy.jsx").read_text(encoding="utf-8")
          engine=Path("client/src/data/pixva/v12/templateEngineV12.js").read_text(encoding="utf-8")
          chat=Path("client/src/components/Chat.jsx").read_text(encoding="utf-8")

          checks = {
            "Supermarkt-Typ aus Prompt": "companyType" in offer and "supermarkt" in offer,
            "Supermarkt-Vorlage wird hart gewählt": "project.data.offerDraft?.companyType==='supermarkt'" in editor and "'v12-supermarkt-einzel'" in editor,
            "Produktname hat eigenes Feld": "dataRole:'product-title:1'" in engine,
            "Mehrere Bildtreffer werden ausprobiert": "for(const candidate of candidates)" in chat and ".slice(0,6)" in chat,
            "Produktbild-Suchbegriff ist Packungsbezogen": "Produktbild Packung" in chat
          }

          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit("FEHLER: "+", ".join(failed))
          for name in checks:
              print("OK:", name)
          PY

      - name: JavaScript Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check client/src/pixva-offer.js
          node --check client/src/data/pixva/v12/templateEngineV12.js

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby Limit überschritten."
            exit 1
          fi

      - name: Geld Preise Abos und PIXVA Hauptlogo schützen
        shell: bash
        run: |
          set -euo pipefail
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x client/node_modules/.bin/vite ]; then
            npm install --prefix client --no-audit --no-fund
          fi
          npm run build --prefix client

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.4"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/components/Chat.jsx \
            client/src/components/DesignEditorLegacy.jsx \
            client/src/pixva-offer.js \
            client/src/data/pixva/v12/templateEngineV12.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.4 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.4 Supermarkt Flyer korrekt erstellen"
          git push origin HEAD:main
