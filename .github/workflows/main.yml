name: PIXVA V11.9.3 LAYOUT UND PROGRAMMIERER FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen V11.9.2 Stand exakt prüfen
        shell: bash
        run: |
          set -e
          test -f client/src/data/pixva/flyerTemplateEngine.js
          test -f client/src/data/pixva/flyer_vorlagen.json
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f lib/pixva-brain.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          grep -Fq "pixvaTemplateList.map((template)" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "function cleanCompanyType(value,other)" lib/pixva-brain.js
          grep -Fq "renderSingle(canvas" client/src/data/pixva/flyerTemplateEngine.js
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.9.3 Payload vorbereiten und Syntax prüfen
        shell: bash
        run: |
          set -e
          rm -rf /tmp/pixva-v11-9-3
          mkdir -p /tmp/pixva-v11-9-3
          echo '' | base64 --decode > /tmp/pixva-v11-9-3/flyerTemplateEngine.js
          echo '' | base64 --decode > /tmp/apply-pixva-v11-9-3.py
          python -m py_compile /tmp/apply-pixva-v11-9-3.py
          node --check /tmp/pixva-v11-9-3/flyerTemplateEngine.js

      - name: V11.9.3 Layout und Branchenlogik einsetzen
        shell: bash
        run: |
          set -e
          python /tmp/apply-pixva-v11-9-3.py

      - name: Schnelle Prüfung vor npm Build
        shell: bash
        run: |
          set -e
          grep -Fq "originX:'left'" client/src/data/pixva/flyerTemplateEngine.js
          grep -Fq "originY:'top'" client/src/data/pixva/flyerTemplateEngine.js
          grep -Fq "setViewportTransform([1,0,0,1,0,0])" client/src/data/pixva/flyerTemplateEngine.js
          grep -Fq "if(type==='programmierer')return{" lib/pixva-brain.js
          grep -Fq "flyerOffer:'29,99 €'" lib/pixva-brain.js
          grep -Fq "type==='programmierer'?{name:'PIXVA'" client/src/components/DesignEditorLegacy.jsx

          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts
          echo '' | base64 --decode > /tmp/check-jsx.cjs
          node --check /tmp/check-jsx.cjs
          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-jsx.cjs             client/src/data/pixva/flyerTemplateEngine.js             client/src/components/DesignEditorLegacy.jsx             lib/pixva-brain.js
          echo "V11.9.3 schnelle Prüfungen grün."

      - name: PayPal Preise und PIXVA Hauptlogo unverändert prüfen
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -e
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          set -e
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -e
          git config user.name "PIXVA V11.9.3"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.9.3 bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.9.3 Layout und Programmierer Fix"
          git push origin HEAD:main
