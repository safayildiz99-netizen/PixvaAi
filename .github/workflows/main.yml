name: PIXVA V14 ALL IN ONE FIRMEN KI UND ANMELDUNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PIXVA Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/App.jsx
          test -f client/src/components/Login.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f api/ai/image-search.js
          test -f lib/pixva-brain.js
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14
          mkdir -p /tmp/pixva-v14/payload

          echo '' | base64 --decode > /tmp/pixva-v14/v14.tar.gz
          tar -tzf /tmp/pixva-v14/v14.tar.gz > /tmp/pixva-v14/files.txt

          test "$(wc -l < /tmp/pixva-v14/files.txt | tr -d ' ')" -eq 9

          tar -xzf /tmp/pixva-v14/v14.tar.gz -C /tmp/pixva-v14/payload

          node --check /tmp/pixva-v14/payload/api/ai/image-search.js
          node --check /tmp/pixva-v14/payload/lib/pixva-brain.js
          node --check /tmp/pixva-v14/payload/api/public.js
          python -m json.tool /tmp/pixva-v14/payload/vercel.json >/dev/null

      - name: V14 komplett einsetzen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf api/v1

          cp /tmp/pixva-v14/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14/payload/client/src/components/Login.jsx client/src/components/Login.jsx
          cp /tmp/pixva-v14/payload/client/src/components/AdminLegacy.jsx client/src/components/AdminLegacy.jsx
          cp /tmp/pixva-v14/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14/payload/lib/pixva-brain.js lib/pixva-brain.js
          cp /tmp/pixva-v14/payload/api/public.js api/public.js
          cp /tmp/pixva-v14/payload/vercel.json vercel.json

      - name: Vercel Hobby Limit sofort prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            find api -type f -name '*.js' ! -name '_*.js' -print | sort
            exit 1
          fi

          if [ -d api/v1 ]; then
            echo "FEHLER: api/v1 existiert noch."
            exit 1
          fi

          echo "OK: Function-Limit eingehalten."

      - name: V14 Funktionen eindeutig prüfen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          checks = {
            "client/src/components/Chat.jsx": [
              "looksLikeOfferFlyerPrompt",
              "generateOfferFlyerMessage",
              "Als Flyer bearbeiten",
              "productImageSource"
            ],
            "client/src/components/DesignEditorLegacy.jsx": [
              "applyPixvaOfferDraftToCanvas",
              "product-image:1",
              "offerDraft"
            ],
            "client/src/components/Login.jsx": [
              "normalizeSignupConfig",
              "registrationConfig.fields",
              "registrationConfig.industries",
              "customFields"
            ],
            "client/src/components/AdminLegacy.jsx": [
              "Anmeldung & Bilder",
              "productImageSource",
              "addSignupIndustry",
              "addSignupField",
              "Anmeldung & Bildquelle sofort speichern"
            ],
            "api/ai/image-search.js": [
              "GOOGLE_CSE_API_KEY",
              "GOOGLE_CSE_CX",
              "PIXVA_PRODUCT_DB_URL",
              "PIXVA_PRODUCT_DB_API_KEY",
              "searchPixvaDatabase",
              "searchGoogle"
            ],
            "lib/pixva-brain.js": [
              "Zusätzliche Registrierungsfelder:"
            ]
          }

          for file, needles in checks.items():
              text = Path(file).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"FEHLER: {file} enthält {needle!r} nicht.")
              print("OK:", file)

          print("PIXVA V14 Funktionsprüfung bestanden.")
          PY

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/ai/image-search.js
          node --check lib/pixva-brain.js
          node --check api/public.js
          python -m json.tool vercel.json >/dev/null

          rm -rf /tmp/pixva-v14-ts
          npm install --prefix /tmp/pixva-v14-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-jsx.cjs <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');

          const files = process.argv.slice(2);
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext
              },
              reportDiagnostics: true,
              fileName: file
            });

            const errors = (result.diagnostics || []).filter(
              d => d.category === ts.DiagnosticCategory.Error
            );

            if (errors.length) {
              console.error("JSX FEHLER:", file);
              for (const d of errors) {
                console.error(ts.flattenDiagnosticMessageText(d.messageText, ' '));
              }
              process.exit(1);
            }
          }

          console.log("PIXVA V14 JSX CHECK PASSED");
          NODE

          NODE_PATH=/tmp/pixva-v14-ts/node_modules node /tmp/pixva-v14-jsx.cjs             client/src/App.jsx             client/src/components/Login.jsx             client/src/components/AdminLegacy.jsx             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nach Build final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Nach Build sind $COUNT Functions vorhanden."
            exit 1
          fi

          TEMPLATES="$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' 2>/dev/null | wc -l | tr -d ' ')"
          PREVIEWS="$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' 2>/dev/null | wc -l | tr -d ' ')"

          if [ "$TEMPLATES" -ne 12 ]; then
            echo "FEHLER: Erwartet 12 PIXVA Vorlagen, gefunden $TEMPLATES."
            exit 1
          fi

          if [ "$PREVIEWS" -ne 12 ]; then
            echo "FEHLER: Erwartet 12 PIXVA Vorschauen, gefunden $PREVIEWS."
            exit 1
          fi

          echo "PIXVA V14 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14"
          git config user.email "actions@users.noreply.github.com"

          git add -A             client/src/App.jsx             client/src/components/Login.jsx             client/src/components/AdminLegacy.jsx             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             api/ai/image-search.js             lib/pixva-brain.js             api/public.js             vercel.json             api/v1

          if git diff --cached --quiet; then
            echo "PIXVA V14 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14 Firmen KI Bildsuche Flyer und dynamische Anmeldung"
          git push origin HEAD:main
