name: PIXVA V14.2 HARD SWITCH FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und geschützte Bereiche prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/App.jsx
          test -f client/src/api.js
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/Login.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Exakt lokal getestetes V14.2 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-2
          mkdir -p /tmp/pixva-v14-2/payload

          echo '' | base64 --decode > /tmp/pixva-v14-2/payload.tar.gz
          tar -tzf /tmp/pixva-v14-2/payload.tar.gz > /tmp/pixva-v14-2/files.txt

          test "$(wc -l < /tmp/pixva-v14-2/files.txt | tr -d ' ')" -eq 17

          tar -xzf /tmp/pixva-v14-2/payload.tar.gz -C /tmp/pixva-v14-2/payload

          test -f /tmp/pixva-v14-2/payload/client/src/pixva-offer.js
          test -f /tmp/pixva-v14-2/payload/client/src/components/Chat.jsx
          test -f /tmp/pixva-v14-2/payload/client/src/components/DesignEditorLegacy.jsx
          test -f /tmp/pixva-v14-2/payload/client/src/components/AdminLegacy.jsx
          test -f /tmp/pixva-v14-2/payload/client/src/components/Login.jsx
          test -f /tmp/pixva-v14-2/payload/api/ai/image-search.js
          test -f /tmp/pixva-v14-2/payload/api/pixva.js

      - name: V14.2 vollständig einsetzen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf api/v1

          cp /tmp/pixva-v14-2/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-2/payload/client/src/api.js client/src/api.js
          cp /tmp/pixva-v14-2/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-2/payload/client/src/components/Login.jsx client/src/components/Login.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/AdminLegacy.jsx client/src/components/AdminLegacy.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/AdminAccounts.jsx client/src/components/AdminAccounts.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/WebsiteBuilder.jsx client/src/components/WebsiteBuilder.jsx
          cp /tmp/pixva-v14-2/payload/client/src/components/VideoStudio.jsx client/src/components/VideoStudio.jsx
          cp /tmp/pixva-v14-2/payload/client/src/data/pixva/v12/templateEngineV12.js client/src/data/pixva/v12/templateEngineV12.js
          cp /tmp/pixva-v14-2/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-2/payload/api/ai/admin-accounts.js api/ai/admin-accounts.js
          cp /tmp/pixva-v14-2/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-2/payload/api/public.js api/public.js
          cp /tmp/pixva-v14-2/payload/lib/pixva-brain.js lib/pixva-brain.js
          cp /tmp/pixva-v14-2/payload/vercel.json vercel.json

      - name: Exakten Flyerwunsch vor jedem langen Build testen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > /tmp/pixva-v14-2-offer-test.mjs
          node /tmp/pixva-v14-2-offer-test.mjs

          grep -Fq "resolveOfferFlyerPrompt(clean, messages)" client/src/components/Chat.jsx
          grep -Fq "await generateOfferFlyerMessage(resolvedOfferPrompt || clean" client/src/components/Chat.jsx
          grep -Fq "Angebotsflyer geöffnet · 0,00 €" client/src/components/Chat.jsx
          grep -Fq "pixvaV142OfferPrepared:true" client/src/components/Chat.jsx
          grep -Fq "project.data.offerDraft?.companyName" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "Build: PIXVA V14.2 HARD SWITCH" client/src/components/AdminLegacy.jsx

          echo "OK: Flyerwunsch umgeht den normalen Chat und öffnet direkt den Editor."

      - name: Anmeldung und Bildquellen prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "registrationConfig.industries" client/src/components/Login.jsx
          grep -Fq "registrationConfig.fields" client/src/components/Login.jsx
          grep -Fq "customFields" client/src/components/Login.jsx

          grep -Fq "Anmeldung & Bilder" client/src/components/AdminLegacy.jsx
          grep -Fq "addSignupIndustry" client/src/components/AdminLegacy.jsx
          grep -Fq "addSignupField" client/src/components/AdminLegacy.jsx
          grep -Fq "productImageSource" client/src/components/AdminLegacy.jsx
          grep -Fq "app_admin_save_ui_settings" client/src/api.js

          grep -Fq "GOOGLE_CSE_API_KEY" api/ai/image-search.js
          grep -Fq "GOOGLE_CSE_CX" api/ai/image-search.js
          grep -Fq "PIXVA_PRODUCT_DB_URL" api/ai/image-search.js
          grep -Fq "PIXVA_PRODUCT_DB_API_KEY" api/ai/image-search.js

          echo "OK: Dynamische Anmeldung + Web/Google/Datenbank-Auswahl vorhanden."

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Mehr als 12 Vercel Functions."
            find api -type f -name '*.js' ! -name '_*.js' -print | sort
            exit 1
          fi

          test ! -d api/v1
          grep -Fq "version:'PIXVA V14.2'" api/public.js

      - name: JavaScript prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/ai/image-search.js
          node --check api/ai/admin-accounts.js
          node --check api/pixva.js
          node --check api/public.js
          node --check lib/pixva-brain.js
          node --check client/src/data/pixva/v12/templateEngineV12.js
          python -m json.tool vercel.json >/dev/null

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten V14.2 Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          grep -R -Fq "PIXVA V14.2 HARD SWITCH" client/dist/assets

          TEMPLATES="$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          PREVIEWS="$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')"

          test "$TEMPLATES" -eq 12
          test "$PREVIEWS" -eq 12

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          test "$COUNT" -le 12

          echo "PIXVA V14.2 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.2"
          git config user.email "actions@users.noreply.github.com"

          git add --             client/src/App.jsx             client/src/api.js             client/src/pixva-offer.js             client/src/components/Login.jsx             client/src/components/AdminLegacy.jsx             client/src/components/AdminAccounts.jsx             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/components/WebsiteBuilder.jsx             client/src/components/VideoStudio.jsx             client/src/data/pixva/v12/templateEngineV12.js             api/ai/image-search.js             api/ai/admin-accounts.js             api/pixva.js             api/public.js             lib/pixva-brain.js             vercel.json

          if git ls-files 'api/v1/**' | grep -q .; then
            git add -u -- api/v1
          fi

          if git diff --cached --quiet; then
            echo "PIXVA V14.2 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.2 Hard Switch Flyer Anmeldung und Bildquelle"
          git push origin HEAD:main
