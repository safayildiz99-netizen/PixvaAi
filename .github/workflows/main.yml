name: PIXVA V14.6 TEMPLATE MANAGER UND EXAKTE PRODUKTE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/pixva.js
          test -f api/ai/image-search.js
          test -f client/src/App.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/pixva-offer.js
          test -f client/src/data/pixva/v12/marketStyles.js
          test -f client/src/data/pixva/v12/templateEngineV12.js

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V14.6 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-6
          mkdir -p /tmp/pixva-v14-6/payload

          echo '' | base64 --decode > /tmp/pixva-v14-6/payload.tar.gz
          tar -xzf /tmp/pixva-v14-6/payload.tar.gz -C /tmp/pixva-v14-6/payload

          COUNT="$(find /tmp/pixva-v14-6/payload -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 9 ]; then
            echo "FEHLER: V14.6 Payload unvollständig. Erwartet 9, gefunden $COUNT."
            exit 1
          fi

      - name: V14.6 vollständig einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-6/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v14-6/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-6/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-6/payload/client/src/components/AdminLegacy.jsx client/src/components/AdminLegacy.jsx
          cp /tmp/pixva-v14-6/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx
          cp /tmp/pixva-v14-6/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v14-6/payload/client/src/pixva-offer.js client/src/pixva-offer.js
          cp /tmp/pixva-v14-6/payload/client/src/pixva-product-match.js client/src/pixva-product-match.js
          cp /tmp/pixva-v14-6/payload/client/src/styles.css client/src/styles.css

      - name: Produktparser mit echten Beispielen testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {extractOfferDraft} from './client/src/pixva-offer.js';

          const cases=[
            {
              text:'erstele mir einen flyer für den supermarkt yaz mega center mit dem produft egetürk sucuk dilim von 4,99€ zur 3,99€',
              company:'yaz mega center', product:'egetürk sucuk dilim', old:'4,99 €', next:'3,99 €'
            },
            {
              text:'erstelle mir einen flyer für den istanbul bazar mit dem produft Ülker Gofret mit dem preis von 1,99€ zur 0,99€',
              company:'istanbul bazar', product:'ülker gofret', old:'1,99 €', next:'0,99 €'
            }
          ];

          for(const c of cases){
            const d=extractOfferDraft(c.text);
            if(d.companyType!=='supermarkt')throw new Error('Supermarkt nicht erkannt: '+c.text);
            if(d.companyName.toLowerCase()!==c.company)throw new Error('Firma falsch: '+d.companyName);
            if(d.productName.toLowerCase()!==c.product)throw new Error('Produkt falsch: '+d.productName);
            if(d.oldPrice!==c.old)throw new Error('Alter Preis falsch: '+d.oldPrice);
            if(d.newPrice!==c.next)throw new Error('Neuer Preis falsch: '+d.newPrice);
          }

          console.log('OK: Beide echten Nutzerbeispiele werden sauber geparst.');
          NODE

      - name: Falsche Produktvarianten blockieren
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {isExactProductCandidate} from './client/src/pixva-product-match.js';

          const wanted='Egetürk Sucuk Dilim';

          const vegan={title:'Egetürk Vegan Dilim Sucuk'};
          const garlic={title:'Egetürk EGEM Knoblauch Wurst in Scheiben'};
          const classic={title:'Egetürk Sucuk Dilim Classic Original'};
          const ulker={title:'Ülker Çikolatalı Gofret'};

          if(isExactProductCandidate(vegan,wanted,.66))throw new Error('Vegan wurde fälschlich akzeptiert.');
          if(isExactProductCandidate(garlic,wanted,.66))throw new Error('EGEM/Knoblauch wurde fälschlich akzeptiert.');
          if(!isExactProductCandidate(classic,wanted,.66))throw new Error('Classic/Original wurde nicht akzeptiert.');
          if(!isExactProductCandidate(ulker,'Ülker Gofret',.66))throw new Error('Ülker Gofret wurde nicht akzeptiert.');

          console.log('OK: Vegan blockiert.');
          console.log('OK: EGEM/Knoblauch blockiert.');
          console.log('OK: Classic/Original akzeptiert.');
          console.log('OK: Ülker Gofret akzeptiert.');
          NODE

      - name: Vorlagen Manager prüfen
        shell: bash
        run: |
          set -euo pipefail

          check() {
            FILE="$1"
            TEXT="$2"
            LABEL="$3"
            if ! grep -Fq -- "$TEXT" "$FILE"; then
              echo "FEHLER: $LABEL"
              exit 1
            fi
            echo "OK: $LABEL"
          }

          check api/pixva.js "action==='template-settings'" "Globale Vorlagenkonfiguration kann geladen werden."
          check api/pixva.js "action==='template-settings-save'" "Admin kann aktive/ausgeblendete Vorlagen speichern."
          check api/pixva.js "action==='template-analyze'" "KI-Vorlagenanalyse ist vorhanden."
          check api/pixva.js "vollständig bearbeitbare PIXVA-Ebenen" "KI rekonstruiert bearbeitbare Ebenen."

          check client/src/components/AdminLegacy.jsx "Ausgeblendete Vorlagen" "Ausgeblendeter Bereich im Admin vorhanden."
          check client/src/components/AdminLegacy.jsx "Hochladen & mit KI bearbeitbar machen" "Eigene Vorlage kann hinzugefügt werden."
          check client/src/components/AdminLegacy.jsx "setBuiltInTemplateVisible" "Standardvorlagen können ausgeblendet werden."
          check client/src/components/AdminLegacy.jsx "setCustomTemplateVisible" "Eigene Vorlagen können ausgeblendet werden."

          check client/src/components/DesignEditorLegacy.jsx "applyCustomTemplate" "Eigene KI-Vorlagen werden im Editor geladen."
          check client/src/components/DesignEditorLegacy.jsx "hiddenTemplateIds" "Ausgeblendete Vorlagen sind für Kunden gefiltert."
          check client/src/components/DesignEditorLegacy.jsx "Textbreite" "Textbreite ist direkt editierbar."
          check client/src/components/DesignEditorLegacy.jsx "activeCustomTemplates" "Aktive eigene Vorlagen erscheinen im Editor."

      - name: JavaScript prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/pixva.js
          node --check api/ai/image-search.js
          node --check client/src/pixva-offer.js
          node --check client/src/pixva-product-match.js
          node --check client/src/data/pixva/v12/templateEngineV12.js
          node --check client/src/data/pixva/v12/marketStyles.js

      - name: Vercel Hobby Limit prüfen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Gebauten Stand final prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          if ! grep -R -Fq "Ausgeblendete Vorlagen" client/dist/assets; then
            echo "FEHLER: Vorlagenmanager fehlt im Produktionsbundle."
            exit 1
          fi

          if ! grep -R -Fq "Textbreite" client/dist/assets; then
            echo "FEHLER: Textbreiten-Editor fehlt im Produktionsbundle."
            exit 1
          fi

          echo "PIXVA V14.6 FINAL CHECK PASSED"

      - name: Nur vollständig erfolgreichen V14.6 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.6"
          git config user.email "actions@users.noreply.github.com"

          git add --             api/pixva.js             api/ai/image-search.js             client/src/App.jsx             client/src/components/AdminLegacy.jsx             client/src/components/Chat.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/pixva-offer.js             client/src/pixva-product-match.js             client/src/styles.css

          if git diff --cached --quiet; then
            echo "PIXVA V14.6 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.6 Vorlagenmanager KI Import und exakte Produkte"
          git push origin HEAD:main
