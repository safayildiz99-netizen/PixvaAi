name: PIXVA V12 ALL IN ONE CORE REBUILD FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geldsystem Hauptlogo und Basis schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/Login.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/VideoStudio.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f client/src/styles.css
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Korrigiertes V12 Komplettpaket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-v12
          mkdir -p /tmp/pixva-v12
          echo '' | base64 --decode > /tmp/pixva-v12/payload.tar.gz
          echo "21a29bb62eb1a82c29dee052361881b357951bab11cc3410203a4525db6348fc  /tmp/pixva-v12/payload.tar.gz" | sha256sum -c -
          tar -tzf /tmp/pixva-v12/payload.tar.gz >/dev/null
          tar -xzf /tmp/pixva-v12/payload.tar.gz -C /tmp/pixva-v12
          python -m py_compile /tmp/pixva-v12/payload/apply-pixva-v12.py
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/catalog.js
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/templateEngineV12.js
          python - <<'PY2'
          import glob,json
          fs=glob.glob('/tmp/pixva-v12/payload/client/src/data/pixva/v12/templates/*.json')
          assert len(fs)==12, len(fs)
          data=[json.load(open(f,encoding='utf-8')) for f in fs]
          assert len({d['id'] for d in data})==12
          assert len({d['layout'] for d in data})==12
          print('12 separate V12 Vorlagen und 12 Layouts OK')
          PY2
          test "$(find /tmp/pixva-v12/payload/client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

      - name: V12 vor echter Änderung gegen aktuellen Code testen
        shell: bash
        run: |
          set -euo pipefail
          TEST=/tmp/pixva-v12-preflight
          rm -rf "$TEST"
          mkdir -p "$TEST/client/src/components" "$TEST/client/src/data/pixva" "$TEST/client/public/templates"
          cp client/src/components/DesignEditorLegacy.jsx "$TEST/client/src/components/"
          cp client/src/components/Login.jsx "$TEST/client/src/components/"
          cp client/src/components/AdminAccounts.jsx "$TEST/client/src/components/"
          cp client/src/components/VideoStudio.jsx "$TEST/client/src/components/"
          cp client/src/styles.css "$TEST/client/src/"

          (cd "$TEST" && python /tmp/pixva-v12/payload/apply-pixva-v12.py)
          sha256sum "$TEST/client/src/components/DesignEditorLegacy.jsx"                     "$TEST/client/src/components/Login.jsx"                     "$TEST/client/src/components/AdminAccounts.jsx"                     "$TEST/client/src/components/VideoStudio.jsx"                     "$TEST/client/src/styles.css" > /tmp/v12-preflight-once.sha

          (cd "$TEST" && python /tmp/pixva-v12/payload/apply-pixva-v12.py)
          sha256sum "$TEST/client/src/components/DesignEditorLegacy.jsx"                     "$TEST/client/src/components/Login.jsx"                     "$TEST/client/src/components/AdminAccounts.jsx"                     "$TEST/client/src/components/VideoStudio.jsx"                     "$TEST/client/src/styles.css" > /tmp/v12-preflight-twice.sha

          diff /tmp/v12-preflight-once.sha /tmp/v12-preflight-twice.sha
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" "$TEST/client/src/components/DesignEditorLegacy.jsx"
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" "$TEST/client/src/components/DesignEditorLegacy.jsx"
          test "$(grep -Fc 'async function resolvePixvaV12Brand()' "$TEST/client/src/components/DesignEditorLegacy.jsx")" -eq 1
          test "$(grep -Fc 'className="pixva-v12-template-panel"' "$TEST/client/src/components/DesignEditorLegacy.jsx")" -eq 1
          test "$(grep -Fc 'function resolveType(base,extra)' "$TEST/client/src/components/AdminAccounts.jsx")" -eq 1
          test "$(grep -Fc 'PIXVA V12 VIDEO BRAIN' "$TEST/client/src/components/VideoStudio.jsx")" -eq 1
          echo "V12 Patcher läuft auf dem aktuellen echten Code zweimal identisch durch."

      - name: V12 alles in einem einsetzen
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/pixva-v12/payload/apply-pixva-v12.py

      - name: V12 Funktionen vor Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "recommendPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "runPixvaV12Audit" client/src/components/DesignEditorLegacy.jsx
          test "$(grep -Fc 'async function resolvePixvaV12Brand()' client/src/components/DesignEditorLegacy.jsx)" -eq 1
          test "$(grep -Fc 'className="pixva-v12-template-panel"' client/src/components/DesignEditorLegacy.jsx)" -eq 1

          grep -Fq "PIXVA V12 LOGIN ACCOUNT TYPES" client/src/components/Login.jsx
          grep -Fq 'value="programmierer"' client/src/components/Login.jsx

          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          test "$(grep -Fc 'function resolveType(base,extra)' client/src/components/AdminAccounts.jsx)" -eq 1

          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx
          grep -Fq "pixvaVideoBrain" client/src/components/VideoStudio.jsx

          node --check client/src/data/pixva/v12/catalog.js
          node --check client/src/data/pixva/v12/templateEngineV12.js

          python - <<'PY2'
          import glob,json
          fs=glob.glob('client/src/data/pixva/v12/templates/*.json')
          assert len(fs)==12
          data=[json.load(open(f,encoding='utf-8')) for f in fs]
          assert len({d['id'] for d in data})==12
          assert len({d['layout'] for d in data})==12
          print('Installierte V12 Vorlagen eindeutig: OK')
          PY2

      - name: Gepatchtes JSX prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts
          cat > /tmp/check-v12-jsx.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs');let bad=false;
          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const r=ts.transpileModule(source,{compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true,fileName:file});
            const errors=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){bad=true;for(const d of errors)console.error(file+': '+ts.flattenDiagnosticMessageText(d.messageText,' '));}
          }
          if(bad)process.exit(1);console.log('PIXVA V12 JSX SYNTAX OK');
          NODE
          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-v12-jsx.cjs             client/src/components/DesignEditorLegacy.jsx             client/src/components/Login.jsx             client/src/components/AdminAccounts.jsx             client/src/components/VideoStudio.jsx             client/src/components/WebsiteBuilder.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: V12 nach Build nochmals prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d client/dist
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

      - name: Workflow behalten
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur vollständig erfolgreichen V12 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PIXVA V12"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V12 ist bereits vollständig installiert."
            exit 0
          fi
          git commit -m "PIXVA V12 All In One Core Rebuild Fixed"
          git push origin HEAD:main
