name: PIXVA V11 MASTER ALL IN ONE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PayPal Preise und PIXVA Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: PIXVA Master-Dateien vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v11-payload
          mkdir -p /tmp/pixva-v11-payload
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/api/pixva.js')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/api/pixva.js'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/lib/pixva-context.js')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/lib/pixva-context.js'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/client/src/components/PixvaCenter.jsx')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/client/src/components/PixvaCenter.jsx'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/client/src/components/PixvaCenter.css')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/client/src/components/PixvaCenter.css'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/client/src/components/Login.jsx')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/client/src/components/Login.jsx'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/client/public/pixva-recovery.html')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/client/public/pixva-recovery.html'
          mkdir -p "$(dirname '/tmp/pixva-v11-payload/supabase/PIXVA-V11-MASTER.sql')"
          echo '' | base64 --decode > '/tmp/pixva-v11-payload/supabase/PIXVA-V11-MASTER.sql'
          echo '' | base64 --decode > /tmp/apply-pixva-v11.py
          python -m py_compile /tmp/apply-pixva-v11.py

      - name: PIXVA V11 Master installieren
        shell: bash
        run: |
          python /tmp/apply-pixva-v11.py

      - name: Geschützte Bereiche unverändert prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after
          echo "PayPal, Preis-/Abo-Komponente und PIXVA-Logo unverändert."

      - name: V11 Funktionen kontrollieren
        shell: bash
        run: |
          test -f api/pixva.js
          test -f lib/pixva-context.js
          test -f client/src/components/PixvaCenter.jsx
          test -f client/src/components/Login.jsx
          grep -Fq "<PixvaCenter" client/src/App.jsx
          grep -Fq "path.startsWith('/api/pixva')" client/src/api.js
          grep -Fq "action=login" client/src/api.js
          grep -Fq "PIXVA PRIVATE CONTEXT V11" api/ai/chat.js
          grep -Fq "action==='2fa-setup'" api/pixva.js
          grep -Fq "action==='agent-start'" api/pixva.js
          grep -Fq "action==='product-ean-lookup'" api/pixva.js
          grep -Fq "action==='instagram-publish'" api/pixva.js
          grep -Fq "app_match_knowledge" supabase/PIXVA-V11-MASTER.sql
          grep -Fq "PIXVA AUTOSAVE V11" client/src/components/DesignEditor.jsx || grep -Fq "PIXVA AUTOSAVE V10" client/src/components/DesignEditor.jsx
          echo "PIXVA V11 Master-Funktionen vorhanden."

      - name: Abhängigkeiten und Servercode prüfen
        shell: bash
        run: |
          npm install
          node --check api/pixva.js
          node --check lib/pixva-context.js
          node --check api/billing.js
          node --check api/ai/chat.js
          node --check api/ai/image.js
          node --check api/ai/video.js
          COUNT=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "Vercel API JavaScript-Dateien: $COUNT"
          if [ "$COUNT" -gt 12 ]; then
            echo "Zu viele API-Funktionen für den vorhandenen Aufbau."
            exit 1
          fi

      - name: Produktions-Build testen
        shell: bash
        run: |
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/pixva-v11-main.yml
          mkdir -p .github/workflows
          cp /tmp/pixva-v11-main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Master Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11 Master ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11 Master All In One"
          git push origin HEAD:main
