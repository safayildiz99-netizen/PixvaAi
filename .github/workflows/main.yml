name: PIXVA V12 ALL IN ONE CORE REBUILD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geldsystem Hauptlogo und Basis schützen
        shell: bash
        run: |
          set -euxo pipefail
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/Login.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/VideoStudio.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f client/src/styles.css
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V12 Komplettpaket vorbereiten
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/pixva-v12
          mkdir -p /tmp/pixva-v12
          echo '' | base64 --decode > /tmp/pixva-v12/payload.tar.gz
          tar -xzf /tmp/pixva-v12/payload.tar.gz -C /tmp/pixva-v12
          python -m py_compile /tmp/pixva-v12/payload/apply-pixva-v12.py
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/catalog.js
          node --check /tmp/pixva-v12/payload/client/src/data/pixva/v12/templateEngineV12.js
          python -c "import glob,json; fs=glob.glob('/tmp/pixva-v12/payload/client/src/data/pixva/v12/templates/*.json'); assert len(fs)==12; data=[json.load(open(f)) for f in fs]; assert len(set(d['id'] for d in data))==12; assert len(set(d['layout'] for d in data))==12; print('12 separate V12 Vorlagen und 12 Layouts OK')"
          test "$(find /tmp/pixva-v12/payload/client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l)" -eq 12

      - name: V12 alles in einem einsetzen
        shell: bash
        run: |
          set -euxo pipefail
          python /tmp/pixva-v12/payload/apply-pixva-v12.py

      - name: V12 Funktionen vor Build prüfen
        shell: bash
        run: |
          set -euxo pipefail
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l)" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l)" -eq 12

          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 TEMPLATE GALLERY" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "recommendPixvaV12Template" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "runPixvaV12Audit" client/src/components/DesignEditorLegacy.jsx

          grep -Fq "PIXVA V12 LOGIN ACCOUNT TYPES" client/src/components/Login.jsx
          grep -Fq 'value="programmierer"' client/src/components/Login.jsx

          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "function resolveType(base,extra)" client/src/components/AdminAccounts.jsx
          test "$(grep -Fc 'function resolveType(base,extra)' client/src/components/AdminAccounts.jsx)" -eq 1

          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx
          grep -Fq "pixvaVideoBrain" client/src/components/VideoStudio.jsx

          node --check client/src/data/pixva/v12/catalog.js
          node --check client/src/data/pixva/v12/templateEngineV12.js

          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts
          echo '' | base64 --decode > /tmp/check-v12-jsx.cjs
          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-v12-jsx.cjs             client/src/components/DesignEditorLegacy.jsx             client/src/components/Login.jsx             client/src/components/AdminAccounts.jsx             client/src/components/VideoStudio.jsx             client/src/components/WebsiteBuilder.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euxo pipefail
          npm install
          npm run build

      - name: V12 nach Build nochmals prüfen
        shell: bash
        run: |
          set -euxo pipefail
          test -d client/dist
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "PIXVA V12 VIDEO BRAIN" client/src/components/VideoStudio.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l)" -eq 12

      - name: Workflow behalten
        shell: bash
        run: |
          set -euxo pipefail
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur vollständig erfolgreichen V12 Stand veröffentlichen
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "PIXVA V12"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V12 ist bereits vollständig installiert."
            exit 0
          fi
          git commit -m "PIXVA V12 All In One Core Rebuild"
          git push origin HEAD:main
