name: PIXVA V11.6.1 Brain Everywhere FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PayPal Preise Logo schützen
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Brain FIX vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v11-6
          mkdir -p /tmp/pixva-v11-6
          echo '' | base64 --decode > /tmp/pixva-v11-6/pixva-brain.js
          echo '' | base64 --decode > /tmp/pixva-v11-6/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/apply-v11-6-1.py
          python -m py_compile /tmp/apply-v11-6-1.py

      - name: Zentrales PIXVA Brain robust einbauen
        shell: bash
        run: |
          python /tmp/apply-v11-6-1.py

      - name: Geschützte Bereiche prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Brain-Verbindungen prüfen
        shell: bash
        run: |
          test -f lib/pixva-brain.js
          grep -Fq "action==='brain-context'" api/pixva.js
          grep -Fq "action==='brain-blueprint'" api/pixva.js
          grep -Fq "PIXVA Brain ist in diesem Modul aktiv" client/src/components/WebsiteBuilder.jsx
          grep -Fq "PIXVA BRAIN GUARANTEED TEMPLATE V11.6" client/src/components/DesignEditor.jsx
          grep -Fq "pixvaBrandImageResult" api/ai/image.js
          grep -Fq "brainInstructions(pixvaBrain,'video'" api/ai/video.js
          grep -Fq "PIXVA BRAIN SHARED CONTEXT" lib/pixva-context.js
          node --check lib/pixva-brain.js
          node --check api/pixva.js
          node --check api/ai/image.js
          node --check api/ai/video.js

      - name: Produktions Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA Brain Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.6.1 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.6.1 Brain Everywhere Fix"
          git push origin HEAD:main
