name: PIXVA V14.11 FLYER OEFFNET WIRKLICH UND PRODUKTVARIANTEN FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen PIXVA Stand und Schutzdateien pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -f client/src/App.jsx
          test -f client/src/components/Chat.jsx
          test -f client/src/pixva-product-match.js
          test -f client/src/pixva-offer.js

          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

          echo "OK: Basis und Schutzdateien vorhanden."

      - name: Getestetes V14.11 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-11
          mkdir -p /tmp/pixva-v14-11/payload

          echo '' | base64 --decode > /tmp/pixva-v14-11/payload.tar.gz
          tar -xzf /tmp/pixva-v14-11/payload.tar.gz -C /tmp/pixva-v14-11/payload

          test -f /tmp/pixva-v14-11/payload/client/src/App.jsx
          test -f /tmp/pixva-v14-11/payload/client/src/pixva-product-match.js

          echo "OK: Payload vollstaendig."

      - name: V14.11 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-11/payload/client/src/App.jsx client/src/App.jsx
          cp /tmp/pixva-v14-11/payload/client/src/pixva-product-match.js client/src/pixva-product-match.js

      - name: Flyer muss vom Chat wirklich in Work geoeffnet werden
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('client/src/App.jsx','utf8').replace(/\s+/g,'');
          const chat=fs.readFileSync('client/src/components/Chat.jsx','utf8').replace(/\s+/g,'');

          const checks=[
            [app.includes('functionopenGeneratedFlyerProject(flyerProject)'), 'App besitzt einen Flyer-Open-Handler.'],
            [app.includes("type:'flyer'"), 'Flyer-Projekt wird als flyer gespeichert.'],
            [app.includes("navigateTo('flyer')"), 'App wechselt wirklich zu Angebote & Flyer.'],
            [app.includes('onOpenFlyerProject={openGeneratedFlyerProject}'), 'Chat bekommt den Flyer-Open-Handler als Prop.'],
            [chat.includes('onOpenFlyerProject'), 'Chat unterstuetzt den Flyer-Open-Callback.'],
            [chat.includes('onOpenFlyerProject?.(') || chat.includes('if(onOpenFlyerProject)'), 'Chat ruft den Callback bei Flyer-Erstellung auf.']
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: Mobile Admin direkt im Hauptmenue pruefen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('client/src/App.jsx','utf8').replace(/\s+/g,'');

          if(!app.includes("isMobile&&activeUser.role==='admin'")){
            console.error('FEHLER: Mobile Admin Shortcut fehlt.');
            process.exit(1);
          }
          if(!app.includes("onClick={()=>changeView('admin')}")){
            console.error('FEHLER: Mobile Admin Button oeffnet Admin nicht.');
            process.exit(1);
          }
          console.log('OK: Admin ist fuer Admin-Konten direkt im mobilen Hauptmenue vorhanden.');
          NODE

      - name: Ungenannte Uelker Varianten blockieren
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {productVariantMismatch,isExactProductCandidate} from './client/src/pixva-product-match.js';

          const generic='Uelker Gofret'.replace('Uelker','Ülker');
          const wrong={title:'Ülker Gofret Deluxe Fındıklı 220 gr',brand:'Ülker'};
          const plain={title:'Ülker Gofret 220 gr',brand:'Ülker'};
          const explicit={title:'Ülker Gofret Fındıklı 220 gr',brand:'Ülker'};

          if(!productVariantMismatch(wrong,generic))
            throw new Error('Fındıklı/Deluxe wird bei generischem Ülker Gofret nicht blockiert.');

          if(isExactProductCandidate(wrong,generic,.56))
            throw new Error('Falsche Fındıklı/Deluxe-Variante wurde akzeptiert.');

          if(!isExactProductCandidate(plain,generic,.56))
            throw new Error('Neutrales Ülker Gofret wurde faelschlich blockiert.');

          if(productVariantMismatch(explicit,'Ülker Gofret Fındıklı'))
            throw new Error('Explizit verlangtes Fındıklı wurde faelschlich blockiert.');

          console.log('OK: Generisch = keine ungenannte Fındıklı/Deluxe-Variante.');
          console.log('OK: Explizit Fındıklı = weiterhin erlaubt.');
          NODE

      - name: Nur erlaubte Dateien duerfen geaendert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Aenderungen:"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
          else
            echo "(keine - V14.11 ist bereits identisch installiert)"
          fi

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              case "$FILE" in
                client/src/App.jsx|client/src/pixva-product-match.js) ;;
                *) echo "FEHLER: Unerlaubte Aenderung: $FILE"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "OK: Nur erlaubte Dateien betroffen."

      - name: JavaScript und JSX pruefen
        shell: bash
        run: |
          set -euo pipefail

          node --check client/src/pixva-product-match.js

          NODE_PATH=/opt/hostedtoolcache/node/22.*/x64/lib/node_modules node -e "process.exit(0)" 2>/dev/null || true

          npm install --prefix /tmp/pixva-v14-11-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-11-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');
          const file='client/src/App.jsx';
          const source=fs.readFileSync(file,'utf8');
          const result=ts.transpileModule(source,{
            compilerOptions:{
              jsx:ts.JsxEmit.ReactJSX,
              target:ts.ScriptTarget.ES2022,
              module:ts.ModuleKind.ESNext
            },
            reportDiagnostics:true,
            fileName:file
          });
          const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          if(errors.length){
            for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
            process.exit(1);
          }
          console.log('APP JSX PASSED');
          NODE

          NODE_PATH=/tmp/pixva-v14-11-ts/node_modules node /tmp/pixva-v14-11-jsx.cjs

      - name: Geld Preise Abos und PIXVA Hauptlogo unveraendert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

          echo "OK: Billing, Abos, Preise und Hauptlogo unveraendert."

      - name: Vercel Hobby Limit pruefen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"
          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby erlaubt maximal 12 Functions."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Build final pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets

          ASSET_COUNT="$(find client/dist/assets -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "FEHLER: Produktions-Bundle enthaelt keine Assets."
            exit 1
          fi

          echo "PIXVA V14.11 FINAL CHECK PASSED - $ASSET_COUNT Assets"

      - name: Nur vollstaendig erfolgreichen V14.11 Stand veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.11"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            client/src/App.jsx \
            client/src/pixva-product-match.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.11 ist bereits installiert. Build und Checks waren erfolgreich."
            exit 0
          fi

          git commit -m "PIXVA V14.11 Flyer wirklich oeffnen und Varianten fixen"
          git push origin HEAD:main
