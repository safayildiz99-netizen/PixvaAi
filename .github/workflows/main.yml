name: PIXVA V12.2 ZENTRALES FIRMENPROFIL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen V12 Stand und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/ai/admin-accounts.js
          test -f api/pixva.js
          test -f lib/pixva-brain.js
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f client/src/components/VideoStudio.jsx
          test -f client/src/data/pixva/v12/templateEngineV12.js

          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V12.2 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v12-2
          mkdir -p /tmp/pixva-v12-2/payload

          echo '' | base64 --decode > /tmp/pixva-v12-2/fix.tar.gz
          tar -tzf /tmp/pixva-v12-2/fix.tar.gz > /tmp/pixva-v12-2/files.txt

          test "$(wc -l < /tmp/pixva-v12-2/files.txt | tr -d ' ')" -eq 8

          grep -Fxq "api/ai/admin-accounts.js" /tmp/pixva-v12-2/files.txt
          grep -Fxq "api/pixva.js" /tmp/pixva-v12-2/files.txt
          grep -Fxq "lib/pixva-brain.js" /tmp/pixva-v12-2/files.txt
          grep -Fxq "client/src/components/AdminAccounts.jsx" /tmp/pixva-v12-2/files.txt
          grep -Fxq "client/src/components/DesignEditorLegacy.jsx" /tmp/pixva-v12-2/files.txt
          grep -Fxq "client/src/components/WebsiteBuilder.jsx" /tmp/pixva-v12-2/files.txt
          grep -Fxq "client/src/components/VideoStudio.jsx" /tmp/pixva-v12-2/files.txt
          grep -Fxq "client/src/data/pixva/v12/templateEngineV12.js" /tmp/pixva-v12-2/files.txt

          tar -xzf /tmp/pixva-v12-2/fix.tar.gz -C /tmp/pixva-v12-2/payload

          node --check /tmp/pixva-v12-2/payload/api/ai/admin-accounts.js
          node --check /tmp/pixva-v12-2/payload/api/pixva.js
          node --check /tmp/pixva-v12-2/payload/lib/pixva-brain.js
          node --check /tmp/pixva-v12-2/payload/client/src/data/pixva/v12/templateEngineV12.js

      - name: V12.2 Zentralprofil einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v12-2/payload/api/ai/admin-accounts.js api/ai/admin-accounts.js
          cp /tmp/pixva-v12-2/payload/api/pixva.js api/pixva.js
          cp /tmp/pixva-v12-2/payload/lib/pixva-brain.js lib/pixva-brain.js
          cp /tmp/pixva-v12-2/payload/client/src/components/AdminAccounts.jsx client/src/components/AdminAccounts.jsx
          cp /tmp/pixva-v12-2/payload/client/src/components/DesignEditorLegacy.jsx client/src/components/DesignEditorLegacy.jsx
          cp /tmp/pixva-v12-2/payload/client/src/components/WebsiteBuilder.jsx client/src/components/WebsiteBuilder.jsx
          cp /tmp/pixva-v12-2/payload/client/src/components/VideoStudio.jsx client/src/components/VideoStudio.jsx
          cp /tmp/pixva-v12-2/payload/client/src/data/pixva/v12/templateEngineV12.js client/src/data/pixva/v12/templateEngineV12.js

      - name: Kontotyp und Altbestand ohne neue DB Spalten testen
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > pixva-v12-2-compat-test.mjs
          node pixva-v12-2-compat-test.mjs
          rm pixva-v12-2-compat-test.mjs

      - name: Gewünschtes Verhalten vor Build prüfen
        shell: bash
        run: |
          set -euo pipefail

          # Geschäftskonto darf auch ohne Firmenname gespeichert werden.
          ! grep -Fq "Für ein Geschäftskonto fehlt der Firmenname" api/ai/admin-accounts.js
          ! grep -Fq "Für ein Geschäftskonto fehlt der Firmenname" client/src/components/AdminAccounts.jsx

          # Admin speichert sofort lokal, kein automatischer kompletter Reload nach Profil speichern.
          grep -Fq "gespeichert · sofort aktiv" client/src/components/AdminAccounts.jsx
          ! grep -Fq "window.setTimeout(()=>{load().catch(()=>{})},250)" client/src/components/AdminAccounts.jsx

          # Altbestand wird über mehrere Firmensignale erkannt.
          grep -Fq "const companySignal=Boolean(first(" api/ai/admin-accounts.js
          grep -Fq "m['firmen-e-mail']" api/ai/admin-accounts.js
          grep -Fq "m['logo-pfad']" api/ai/admin-accounts.js

          # Memory/Kontotyp ist die zentrale Quelle für PIXVA Brain.
          grep -Fq "const storedType=String(first(mem['kontotyp'],u.account_type)).toLowerCase();" lib/pixva-brain.js
          grep -Fq "companyName:first(mem['firma'],profile.company_name,brand.company_name)" lib/pixva-brain.js

          # Echte Geschäftskonten bekommen keine erfundenen Kontaktdaten.
          grep -Fq "if(brain?.isCompany)" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "pixva_example_mode:false" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "const exampleMode=source?.pixva_example_mode??c?.pixva_example_mode??!source?.isCompany;" client/src/data/pixva/v12/templateEngineV12.js

          # Website verwendet bei echten Firmen keine Beispiel-Firmendaten und kein PIXVA-Ersatzlogo.
          grep -Fq "const realCompany=Boolean(brain?.isCompany);" client/src/components/WebsiteBuilder.jsx
          grep -Fq "logo:c.logoDataUrl||c.logoUrl||c.logoPath||(realCompany?'':(fallback.logo||PIXVA_LOGO))" client/src/components/WebsiteBuilder.jsx
          grep -Fq "const safeLogo=d.logo||'';" client/src/components/WebsiteBuilder.jsx

          # Video verwendet das zentrale Brain und erfindet bei realen Firmen keinen Firmennamen.
          grep -Fq "brain?.isCompany ? '' : 'BEISPIEL FIRMA'" client/src/components/VideoStudio.jsx

          # Alte V11-Autovorlage ist deaktiviert, damit keine falschen Beispieldaten aufblitzen.
          grep -Fq "alte V11-Autovorlage deaktiviert" client/src/components/DesignEditorLegacy.jsx

          # V12 bleibt vollständig.
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

      - name: JavaScript und JSX vor langem Build prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/ai/admin-accounts.js
          node --check api/pixva.js
          node --check lib/pixva-brain.js
          node --check client/src/data/pixva/v12/templateEngineV12.js

          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/check-jsx.cjs <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');

          for (const file of process.argv.slice(2)) {
            const source = fs.readFileSync(file,'utf8');
            const result = ts.transpileModule(source,{
              compilerOptions:{
                jsx:ts.JsxEmit.ReactJSX,
                target:ts.ScriptTarget.ES2022,
                module:ts.ModuleKind.ESNext
              },
              reportDiagnostics:true,
              fileName:file
            });
            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){
              console.error('JSX FEHLER:',file);
              for(const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              process.exit(1);
            }
          }
          console.log('PIXVA V12.2 JSX CHECK PASSED');
          NODE

          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-jsx.cjs             client/src/components/AdminAccounts.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/components/WebsiteBuilder.jsx             client/src/components/VideoStudio.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nur vollständigen V12.2 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist

          git config user.name "PIXVA V12.2"
          git config user.email "actions@users.noreply.github.com"

          git add             api/ai/admin-accounts.js             api/pixva.js             lib/pixva-brain.js             client/src/components/AdminAccounts.jsx             client/src/components/DesignEditorLegacy.jsx             client/src/components/WebsiteBuilder.jsx             client/src/components/VideoStudio.jsx             client/src/data/pixva/v12/templateEngineV12.js

          if git diff --cached --quiet; then
            echo "PIXVA V12.2 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V12.2 zentrales Firmenprofil und korrekte Kontentrennung"
          git push origin HEAD:main
