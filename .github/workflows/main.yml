name: PIXVA V14.5.3 PRODUKTVARIANTE RICHTIG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/ai/image-search.js
          test -f client/src/components/Chat.jsx
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getesteten Varianten Fix vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-5-3
          mkdir -p /tmp/pixva-v14-5-3/payload

          echo '' | base64 --decode > /tmp/pixva-v14-5-3/payload.tar.gz
          tar -xzf /tmp/pixva-v14-5-3/payload.tar.gz -C /tmp/pixva-v14-5-3/payload

          test -f /tmp/pixva-v14-5-3/payload/api/ai/image-search.js
          test -f /tmp/pixva-v14-5-3/payload/client/src/components/Chat.jsx

      - name: V14.5.3 einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-5-3/payload/api/ai/image-search.js api/ai/image-search.js
          cp /tmp/pixva-v14-5-3/payload/client/src/components/Chat.jsx client/src/components/Chat.jsx

      - name: Classic gegen Vegan exakt testen
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import {scoreProductResult,rankProductResults} from './api/ai/image-search.js';

          const query='Egetürk Sucuk Dilim Produktbild Packung freigestellt';

          const classic={
            title:'Egetürk Sucuk Dilim Classic Original 200g',
            imageUrl:'https://example.com/classic.jpg',
            source:'Web'
          };

          const vegan={
            title:'Egetürk Vegan Dilim Sucuk 200g',
            imageUrl:'https://example.com/vegan.jpg',
            source:'Web'
          };

          const ranked=rankProductResults([vegan,classic],query);

          if(ranked[0]?.title!==classic.title){
            throw new Error('FEHLER: Ohne Vegan-Wunsch wurde Vegan vor Classic gewählt.');
          }

          if(scoreProductResult(vegan,query)>=scoreProductResult(classic,query)){
            throw new Error('FEHLER: Vegan wird ohne ausdrücklichen Wunsch nicht ausreichend abgewertet.');
          }

          const veganQuery='Egetürk Vegan Sucuk Dilim';

          if(scoreProductResult(vegan,veganQuery)<=scoreProductResult(classic,veganQuery)){
            throw new Error('FEHLER: Bei ausdrücklichem Vegan-Wunsch wird Vegan nicht bevorzugt.');
          }

          console.log('OK: Egetürk Sucuk Dilim -> Classic/Original vor Vegan.');
          console.log('OK: Egetürk Vegan Sucuk Dilim -> Vegan vor Classic.');
          NODE

      - name: Variantenfilter im Chat prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "productVariantMismatch" client/src/components/Chat.jsx
          grep -Fq "exactCandidates" client/src/components/Chat.jsx
          grep -Fq "vegan|veggie|vegetarisch|pflanzlich" client/src/components/Chat.jsx

          echo "OK: Chat verwirft ungewollte Produktvarianten vor dem Einfügen."

      - name: JavaScript und JSX prüfen
        shell: bash
        run: |
          set -euo pipefail

          node --check api/ai/image-search.js

          rm -rf /tmp/pixva-v14-5-3-ts
          npm install --prefix /tmp/pixva-v14-5-3-ts typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts >/dev/null

          cat > /tmp/pixva-v14-5-3-jsx.cjs <<'NODE'
          const ts=require('typescript');
          const fs=require('fs');

          for(const file of process.argv.slice(2)){
            const source=fs.readFileSync(file,'utf8');
            const result=ts.transpileModule(source,{
              compilerOptions:{
                jsx:ts.JsxEmit.ReactJSX,
                target:ts.ScriptTarget.ES2022,
                module:ts.ModuleKind.ESNext
              },
              reportDiagnostics:true,
              fileName:file
            });

            const errors=(result.diagnostics||[]).filter(
              d=>d.category===ts.DiagnosticCategory.Error
            );

            if(errors.length){
              console.error('JSX FEHLER:',file);
              for(const d of errors){
                console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
              }
              process.exit(1);
            }
          }

          console.log('PIXVA V14.5.3 JSX CHECK PASSED');
          NODE

          NODE_PATH=/tmp/pixva-v14-5-3-ts/node_modules node /tmp/pixva-v14-5-3-jsx.cjs             client/src/components/Chat.jsx

      - name: Geld Preise Abos und Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.5.3"
          git config user.email "actions@users.noreply.github.com"

          git add --             api/ai/image-search.js             client/src/components/Chat.jsx

          if git diff --cached --quiet; then
            echo "PIXVA V14.5.3 ist bereits installiert."
            exit 0
          fi

          git commit -m "PIXVA V14.5.3 Produktvarianten exakt auswählen"
          git push origin HEAD:main
