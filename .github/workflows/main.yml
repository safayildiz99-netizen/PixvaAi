name: PIXVA V11.9 KONTEN UND DATEI VORLAGEN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basis und geschützte Bereiche prüfen
        shell: bash
        run: |
          set -e
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/DesignEditor.jsx
          test -f client/src/components/AdminAccounts.jsx
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          grep -Fq "atlas-grid" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "function mergeAccount" client/src/components/AdminAccounts.jsx
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.9 Payload vorbereiten
        shell: bash
        run: |
          set -e
          rm -rf /tmp/pixva-v11-9
          mkdir -p /tmp/pixva-v11-9/previews
          echo '' | base64 --decode > /tmp/pixva-v11-9/flyer_vorlagen.json
          echo '' | base64 --decode > /tmp/pixva-v11-9/flyerTemplateEngine.js
          echo '' | base64 --decode > /tmp/pixva-v11-9/DesignEditor.jsx
          echo '' | base64 --decode > /tmp/apply-pixva-v11-9.py
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/elektriker.svg
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/firma.svg
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/software-ki.svg
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/supermarkt-6er.svg
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/supermarkt.svg
          echo '' | base64 --decode > /tmp/pixva-v11-9/previews/werbetechnik.svg
          python -m py_compile /tmp/apply-pixva-v11-9.py
          python -m json.tool /tmp/pixva-v11-9/flyer_vorlagen.json >/dev/null
          node --check /tmp/pixva-v11-9/flyerTemplateEngine.js
          cp /tmp/pixva-v11-9/DesignEditor.jsx /tmp/DesignEditor-check.mjs
          node --check /tmp/DesignEditor-check.mjs

      - name: V11.9 einsetzen
        shell: bash
        run: |
          set -e
          python /tmp/apply-pixva-v11-9.py

      - name: Schnell prüfen bevor der lange Build startet
        shell: bash
        run: |
          set -e
          test -f client/src/data/pixva/flyer_vorlagen.json
          test -f client/src/data/pixva/flyerTemplateEngine.js
          test -f client/public/templates/pixva/software-ki.svg
          grep -Fq "pixvaTemplateList.map" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "applyPixvaFileTemplate" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "hasCompany=Boolean" client/src/components/AdminAccounts.jsx
          if grep -Fq "applyTemplate('atlas-grid')" client/src/components/DesignEditorLegacy.jsx; then
            echo "FEHLER: alte Atlas-Galerie ist noch aktiv."
            exit 1
          fi
          rm -rf /tmp/pixva-jsx-check
          npm install --prefix /tmp/pixva-jsx-check typescript@5.9.2 --no-save --no-audit --no-fund --ignore-scripts
          cat > /tmp/check-jsx.cjs <<'NODE'
const ts=require('typescript'),fs=require('fs');
for(const file of process.argv.slice(2)){
  const source=fs.readFileSync(file,'utf8');
  const result=ts.transpileModule(source,{compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true,fileName:file});
  const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
  if(errors.length){
    for(const d of errors)console.error(file,ts.flattenDiagnosticMessageText(d.messageText,' '));
    process.exit(1);
  }
}
console.log('JSX Syntax OK');
NODE
          NODE_PATH=/tmp/pixva-jsx-check/node_modules node /tmp/check-jsx.cjs client/src/components/DesignEditorLegacy.jsx client/src/components/AdminAccounts.jsx
          node --check client/src/data/pixva/flyerTemplateEngine.js
          python -m json.tool client/src/data/pixva/flyer_vorlagen.json >/dev/null
          echo "Alle schnellen Prüfungen grün."

      - name: PayPal Preise und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -e
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -e
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          set -e
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          set -e
          git config user.name "PIXVA V11.9"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.9 bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.9 Konten und Datei Vorlagen"
          git push origin HEAD:main
