name: PIXVA V13 KI CORE API UND SICHERHEIT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V12 Basis und Schutzdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/ai/admin-accounts.js
          test -f api/pixva.js
          test -f lib/pixva-brain.js
          test -f client/src/components/AdminAccounts.jsx
          test -f client/src/components/DesignEditorLegacy.jsx
          test -f client/src/components/WebsiteBuilder.jsx
          test -f client/src/components/VideoStudio.jsx
          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12

          grep -R -Fq "app_memory_items" supabase
          grep -R -Fq "app_take_public_rate_limit" supabase
          grep -R -Fq "app_user_snapshots" supabase
          grep -R -Fq "app_error_logs" supabase
          grep -R -Fq "app_project_versions" supabase

          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: Lokal getestetes V13 Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixva-v13
          mkdir -p /tmp/pixva-v13/payload
          echo '' | base64 --decode > /tmp/pixva-v13/payload.tar.gz
          tar -tzf /tmp/pixva-v13/payload.tar.gz > /tmp/pixva-v13/files.txt
          test "$(wc -l < /tmp/pixva-v13/files.txt | tr -d ' ')" -eq 27
          grep -Fxq "api/ai/admin-accounts.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/ai/chat.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/ai/image.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/ai/video.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/pixva.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/_shared.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/chat.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/brain.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/blueprint.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/image.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/video.js" /tmp/pixva-v13/files.txt
          grep -Fxq "api/v1/status.js" /tmp/pixva-v13/files.txt
          grep -Fxq "lib/pixva-api-keys.js" /tmp/pixva-v13/files.txt
          grep -Fxq "lib/pixva-provider-routing.js" /tmp/pixva-v13/files.txt
          grep -Fxq "lib/pixva-observability.js" /tmp/pixva-v13/files.txt
          grep -Fxq "lib/pixva-context.js" /tmp/pixva-v13/files.txt
          grep -Fxq "lib/pixva-brain.js" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/App.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/AccountSettings.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/AdminAccounts.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/DesignEditorLegacy.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/WebsiteBuilder.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/VideoStudio.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/PixvaCenter.jsx" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/components/PixvaCenter.css" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/styles.css" /tmp/pixva-v13/files.txt
          grep -Fxq "client/src/data/pixva/v12/templateEngineV12.js" /tmp/pixva-v13/files.txt
          tar -xzf /tmp/pixva-v13/payload.tar.gz -C /tmp/pixva-v13/payload

      - name: V13 KI Core einsetzen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname api/ai/admin-accounts.js)"; cp "/tmp/pixva-v13/payload/api/ai/admin-accounts.js" "api/ai/admin-accounts.js"
          mkdir -p "$(dirname api/ai/chat.js)"; cp "/tmp/pixva-v13/payload/api/ai/chat.js" "api/ai/chat.js"
          mkdir -p "$(dirname api/ai/image.js)"; cp "/tmp/pixva-v13/payload/api/ai/image.js" "api/ai/image.js"
          mkdir -p "$(dirname api/ai/video.js)"; cp "/tmp/pixva-v13/payload/api/ai/video.js" "api/ai/video.js"
          mkdir -p "$(dirname api/pixva.js)"; cp "/tmp/pixva-v13/payload/api/pixva.js" "api/pixva.js"
          mkdir -p "$(dirname api/v1/_shared.js)"; cp "/tmp/pixva-v13/payload/api/v1/_shared.js" "api/v1/_shared.js"
          mkdir -p "$(dirname api/v1/chat.js)"; cp "/tmp/pixva-v13/payload/api/v1/chat.js" "api/v1/chat.js"
          mkdir -p "$(dirname api/v1/brain.js)"; cp "/tmp/pixva-v13/payload/api/v1/brain.js" "api/v1/brain.js"
          mkdir -p "$(dirname api/v1/blueprint.js)"; cp "/tmp/pixva-v13/payload/api/v1/blueprint.js" "api/v1/blueprint.js"
          mkdir -p "$(dirname api/v1/image.js)"; cp "/tmp/pixva-v13/payload/api/v1/image.js" "api/v1/image.js"
          mkdir -p "$(dirname api/v1/video.js)"; cp "/tmp/pixva-v13/payload/api/v1/video.js" "api/v1/video.js"
          mkdir -p "$(dirname api/v1/status.js)"; cp "/tmp/pixva-v13/payload/api/v1/status.js" "api/v1/status.js"
          mkdir -p "$(dirname lib/pixva-api-keys.js)"; cp "/tmp/pixva-v13/payload/lib/pixva-api-keys.js" "lib/pixva-api-keys.js"
          mkdir -p "$(dirname lib/pixva-provider-routing.js)"; cp "/tmp/pixva-v13/payload/lib/pixva-provider-routing.js" "lib/pixva-provider-routing.js"
          mkdir -p "$(dirname lib/pixva-observability.js)"; cp "/tmp/pixva-v13/payload/lib/pixva-observability.js" "lib/pixva-observability.js"
          mkdir -p "$(dirname lib/pixva-context.js)"; cp "/tmp/pixva-v13/payload/lib/pixva-context.js" "lib/pixva-context.js"
          mkdir -p "$(dirname lib/pixva-brain.js)"; cp "/tmp/pixva-v13/payload/lib/pixva-brain.js" "lib/pixva-brain.js"
          mkdir -p "$(dirname client/src/App.jsx)"; cp "/tmp/pixva-v13/payload/client/src/App.jsx" "client/src/App.jsx"
          mkdir -p "$(dirname client/src/components/AccountSettings.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/AccountSettings.jsx" "client/src/components/AccountSettings.jsx"
          mkdir -p "$(dirname client/src/components/AdminAccounts.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/AdminAccounts.jsx" "client/src/components/AdminAccounts.jsx"
          mkdir -p "$(dirname client/src/components/DesignEditorLegacy.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/DesignEditorLegacy.jsx" "client/src/components/DesignEditorLegacy.jsx"
          mkdir -p "$(dirname client/src/components/WebsiteBuilder.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/WebsiteBuilder.jsx" "client/src/components/WebsiteBuilder.jsx"
          mkdir -p "$(dirname client/src/components/VideoStudio.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/VideoStudio.jsx" "client/src/components/VideoStudio.jsx"
          mkdir -p "$(dirname client/src/components/PixvaCenter.jsx)"; cp "/tmp/pixva-v13/payload/client/src/components/PixvaCenter.jsx" "client/src/components/PixvaCenter.jsx"
          mkdir -p "$(dirname client/src/components/PixvaCenter.css)"; cp "/tmp/pixva-v13/payload/client/src/components/PixvaCenter.css" "client/src/components/PixvaCenter.css"
          mkdir -p "$(dirname client/src/styles.css)"; cp "/tmp/pixva-v13/payload/client/src/styles.css" "client/src/styles.css"
          mkdir -p "$(dirname client/src/data/pixva/v12/templateEngineV12.js)"; cp "/tmp/pixva-v13/payload/client/src/data/pixva/v12/templateEngineV12.js" "client/src/data/pixva/v12/templateEngineV12.js"

      - name: Server Syntax und Sicherheitsmarker prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai/admin-accounts.js
          node --check api/ai/chat.js
          node --check api/ai/image.js
          node --check api/ai/video.js
          node --check api/pixva.js
          node --check lib/pixva-api-keys.js
          node --check lib/pixva-provider-routing.js
          node --check lib/pixva-observability.js
          node --check lib/pixva-context.js
          node --check lib/pixva-brain.js
          for f in api/v1/*.js; do node --check "$f"; done

          grep -Fq "pixva_live_" lib/pixva-api-keys.js
          grep -Fq "timingSafeEqual" lib/pixva-api-keys.js
          grep -Fq "PIXVA_API_SCOPES" lib/pixva-api-keys.js
          grep -Fq "app_take_public_rate_limit" lib/pixva-api-keys.js
          grep -Fq "chatFallbackEnabled:false" lib/pixva-provider-routing.js
          grep -Fq "https://api.openai.com/v1/responses" api/ai/chat.js
          grep -Fq "sharedBrain?brainInstructions" lib/pixva-context.js
          grep -Fq "snapshot-auto" client/src/App.jsx
          grep -Fq "quality-check" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "quality-check" client/src/components/WebsiteBuilder.jsx
          grep -Fq "PIXVA API-Keys" client/src/components/AccountSettings.jsx
          grep -Fq "KI-Provider & Fallback" client/src/components/PixvaCenter.jsx
          grep -Fq "error-resolve" client/src/components/PixvaCenter.jsx
          grep -Fq "Public API Aktivität" client/src/components/PixvaCenter.jsx
          grep -Fq "confirmCost!==true" api/v1/image.js
          grep -Fq "confirmCost!==true" api/v1/video.js
          grep -Fq "logServerError" api/ai/image.js
          grep -Fq "logServerError" api/ai/video.js
          grep -Fq "inputTokens" api/ai/chat.js

      - name: Geschäft Privat und Altbestand Kompatibilität testen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > pixva-v13-account-test.mjs
          node pixva-v13-account-test.mjs
          rm pixva-v13-account-test.mjs

      - name: API Key Hash Scopes Rate Limit und Widerruf testen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > pixva-v13-api-key-test.mjs
          node pixva-v13-api-key-test.mjs
          rm pixva-v13-api-key-test.mjs

      - name: V12 Vorlagen und zentrales Firmenprofil schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12
          grep -Fq "PIXVA V12 ACCOUNT CLASSIFICATION" client/src/components/AdminAccounts.jsx
          grep -Fq "PIXVA V12 ALL IN ONE EDITOR" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "pixva-account-profile" api/ai/admin-accounts.js
          grep -Fq "const storedType=String(first(mem['kontotyp'],u.account_type)).toLowerCase();" lib/pixva-brain.js
          grep -Fq "pixva_example_mode:false" client/src/components/DesignEditorLegacy.jsx
          grep -Fq "const realCompany=Boolean(brain?.isCompany);" client/src/components/WebsiteBuilder.jsx

      - name: Geld Preise Abos und PIXVA Hauptlogo unverändert
        shell: bash
        run: |
          set -euo pipefail
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: V13 nach Build nochmals prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -d client/dist
          test "$(find client/src/data/pixva/v12/templates -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" -eq 12
          test "$(find client/public/templates/pixva-v12 -maxdepth 1 -name '*.svg' | wc -l | tr -d ' ')" -eq 12
          grep -Fq "PIXVA API-Keys" client/src/components/AccountSettings.jsx
          grep -Fq "KI-Provider & Fallback" client/src/components/PixvaCenter.jsx
          grep -Fq "PIXVA V13" api/v1/status.js

      - name: Nur vollständig erfolgreichen V13 Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PIXVA V13"
          git config user.email "actions@users.noreply.github.com"
          git add \
            api/ai/admin-accounts.js \
            api/ai/chat.js \
            api/ai/image.js \
            api/ai/video.js \
            api/pixva.js \
            api/v1/_shared.js \
            api/v1/chat.js \
            api/v1/brain.js \
            api/v1/blueprint.js \
            api/v1/image.js \
            api/v1/video.js \
            api/v1/status.js \
            lib/pixva-api-keys.js \
            lib/pixva-provider-routing.js \
            lib/pixva-observability.js \
            lib/pixva-context.js \
            lib/pixva-brain.js \
            client/src/App.jsx \
            client/src/components/AccountSettings.jsx \
            client/src/components/AdminAccounts.jsx \
            client/src/components/DesignEditorLegacy.jsx \
            client/src/components/WebsiteBuilder.jsx \
            client/src/components/VideoStudio.jsx \
            client/src/components/PixvaCenter.jsx \
            client/src/components/PixvaCenter.css \
            client/src/styles.css \
            client/src/data/pixva/v12/templateEngineV12.js

          if git diff --cached --quiet; then
            echo "PIXVA V13 ist bereits vollständig installiert."
            exit 0
          fi

          git commit -m "PIXVA V13 KI Core API Sicherheit Backups und Qualitätscheck"
          git push origin HEAD:main
