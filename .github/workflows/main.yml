name: PIXVA V11.7.1 Validation Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geschützte Bereiche sichern
        shell: bash
        run: |
          test -f api/billing.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/public/pixva-logo.png
          sha256sum api/billing.js > /tmp/billing.before
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

      - name: V11.7 vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pixva-v11-7
          mkdir -p /tmp/pixva-v11-7
          echo '' | base64 --decode > /tmp/pixva-v11-7/WebsiteBuilder.jsx
          echo '' | base64 --decode > /tmp/apply-v11-7.py
          python -m py_compile /tmp/apply-v11-7.py

      - name: Beispiele und Kontentrennung einbauen
        shell: bash
        run: |
          python /tmp/apply-v11-7.py

      - name: Schutz prüfen
        shell: bash
        run: |
          sha256sum api/billing.js > /tmp/billing.after
          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after
          diff /tmp/billing.before /tmp/billing.after
          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/logo.before /tmp/logo.after

      - name: V11.7.1 korrekt prüfen
        shell: bash
        run: |
          set -e
          # Website: Beispielmodus + eingebettetes Beispiel-Logo prüfen.
          grep -Fq "BEISPIELVORSCHAU" client/src/components/WebsiteBuilder.jsx
          grep -Fq "const EXAMPLE_LOGO=" client/src/components/WebsiteBuilder.jsx
          grep -Fq "data:image/svg+xml;base64" client/src/components/WebsiteBuilder.jsx

          # Konten: eindeutige Gruppen prüfen.
          grep -Fq "Admin erstellt · Firmenkonten" client/src/components/PixvaCenter.jsx
          grep -Fq "Admin erstellt · Privatkonten" client/src/components/PixvaCenter.jsx
          grep -Fq "Selbst registriert · Firmenkonten" client/src/components/PixvaCenter.jsx
          grep -Fq "Selbst registriert · Privatkonten" client/src/components/PixvaCenter.jsx
          grep -Fq "Bestehende Firmenkonten" client/src/components/PixvaCenter.jsx
          grep -Fq "Bestehende Privatkonten" client/src/components/PixvaCenter.jsx

          # Editor: Beispiel-/Firmenkontext muss vorhanden sein.
          grep -Fq "pixva_example_mode" client/src/components/DesignEditor.jsx
          grep -Fq "BEISPIEL FIRMA" client/src/components/DesignEditor.jsx

          echo "PIXVA V11.7.1 Prüfungen erfolgreich."

      - name: Produktions Build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Workflow behalten
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/workflows/main.yml" > /tmp/main.yml
          cp /tmp/main.yml .github/workflows/main.yml

      - name: Nur erfolgreichen Stand veröffentlichen
        shell: bash
        run: |
          git config user.name "PIXVA V11.7.1 Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PIXVA V11.7.1 ist bereits installiert."
            exit 0
          fi
          git commit -m "PIXVA V11.7.1 Examples Account Groups Fix"
          git push origin HEAD:main
