name: PIXVA V14.13 PAYPAL ZAHLEN FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payment-final:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zahlungsbasis und geschuetzte Dateien pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -f api/billing.js
          test -f api/_lib.js
          test -f client/src/components/Subscriptions.jsx
          test -f client/src/components/AdminLegacy.jsx
          test -f client/src/plans.js
          test -f client/public/pixva-logo.png

          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.before
          sha256sum client/src/components/AdminLegacy.jsx > /tmp/admin.before
          sha256sum client/src/plans.js > /tmp/plans.before
          sha256sum client/public/pixva-logo.png > /tmp/logo.before

          echo "OK: Zahlungsbasis vorhanden."

      - name: Getestetes V14.13 Zahlungspaket vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pixva-v14-13
          mkdir -p /tmp/pixva-v14-13/payload

          echo '' | base64 --decode > /tmp/pixva-v14-13/payload.tar.gz
          tar -xzf /tmp/pixva-v14-13/payload.tar.gz -C /tmp/pixva-v14-13/payload

          test -f /tmp/pixva-v14-13/payload/api/billing.js

      - name: PayPal Final Fix einsetzen
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/pixva-v14-13/payload/api/billing.js api/billing.js

      - name: Zahlungslogik semantisch pruefen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const billing=fs.readFileSync('api/billing.js','utf8').replace(/\s+/g,'');

          const checks=[
            [billing.includes("brand_name:'PIXVA'"), 'PayPal Checkout zeigt PIXVA als Marke.'],
            [billing.includes("description:`PIXVA${plan.name}"), 'PayPal-Beschreibung verwendet PIXVA.'],
            [billing.includes("constinvoiceId=`pixva-"), 'Neue Rechnungs-ID nutzt PIXVA Prefix.'],
            [billing.includes('fetchWithTimeout'), 'PayPal-Aufrufe haben ein Zeitlimit.'],
            [billing.includes('paymentDatabaseHealth'), 'Zahlungsdatenbank wird geprueft.'],
            [billing.includes('paypalConnected'), 'Echte PayPal OAuth-Verbindung wird geprueft.'],
            [billing.includes('databaseReady'), 'Supabase-Zahlungstabellen werden geprueft.'],
            [billing.includes('webhookConfigured'), 'Webhook-Bereitschaft wird ausgewiesen.'],
            [billing.includes("details.status!=='COMPLETED'"), 'Zugang erst nach COMPLETED.'],
            [billing.includes("details.currency!==order.currency"), 'Waehrung wird serverseitig geprueft.'],
            [billing.includes("Number(details.amountValue).toFixed(2)!==expected"), 'Betrag wird serverseitig geprueft.']
          ];

          for(const [ok,label] of checks){
            if(!ok){
              console.error('FEHLER:',label);
              process.exit(1);
            }
            console.log('OK:',label);
          }
          NODE

      - name: PayPal Orders Ablauf pruefen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs=require('fs');
          const billing=fs.readFileSync('api/billing.js','utf8');

          const required=[
            "/v1/oauth2/token",
            "/v2/checkout/orders",
            "/capture",
            "paypal-return",
            "verify-webhook-signature",
            "PAYMENT.CAPTURE.COMPLETED",
            "PAYMENT.CAPTURE.REFUNDED"
          ];

          for(const value of required){
            if(!billing.includes(value)){
              console.error('FEHLER: Zahlungsbaustein fehlt:',value);
              process.exit(1);
            }
            console.log('OK:',value);
          }
          NODE

      - name: JavaScript Syntax pruefen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/billing.js

      - name: Nur Billing Datei darf geaendert sein
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          echo "Gefundene Aenderungen:"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
          else
            echo "(keine - V14.13 ist bereits identisch installiert)"
          fi

          if [ -n "$CHANGED" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              if [ "$FILE" != "api/billing.js" ]; then
                echo "FEHLER: Unerlaubte Aenderung: $FILE"
                exit 1
              fi
            done <<< "$CHANGED"
          fi

      - name: Preise Abos Admin UI und PIXVA Hauptlogo unveraendert
        shell: bash
        run: |
          set -euo pipefail

          sha256sum client/src/components/Subscriptions.jsx > /tmp/subscriptions.after
          sha256sum client/src/components/AdminLegacy.jsx > /tmp/admin.after
          sha256sum client/src/plans.js > /tmp/plans.after
          sha256sum client/public/pixva-logo.png > /tmp/logo.after

          diff /tmp/subscriptions.before /tmp/subscriptions.after
          diff /tmp/admin.before /tmp/admin.after
          diff /tmp/plans.before /tmp/plans.after
          diff /tmp/logo.before /tmp/logo.after

          echo "OK: Preise, Abos, Admin-UI und Hauptlogo unveraendert."

      - name: Vercel Hobby Limit pruefen
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find api -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')"
          echo "Deploybare Vercel Functions: $COUNT / 12"

          if [ "$COUNT" -gt 12 ]; then
            echo "FEHLER: Vercel Hobby Limit ueberschritten."
            exit 1
          fi

      - name: Produktions Build
        shell: bash
        run: |
          set -euo pipefail

          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Build final pruefen
        shell: bash
        run: |
          set -euo pipefail

          test -d client/dist
          test -d client/dist/assets

          ASSET_COUNT="$(find client/dist/assets -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "FEHLER: Produktions-Build enthaelt keine Assets."
            exit 1
          fi

          echo "PIXVA V14.13 PAYMENT FINAL CHECK PASSED"

      - name: Nur erfolgreichen Zahlungsstand veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "PIXVA V14.13"
          git config user.email "actions@users.noreply.github.com"

          git add -- api/billing.js

          if git diff --cached --quiet; then
            echo "PIXVA V14.13 ist bereits installiert. Alle Tests und Build waren erfolgreich."
            exit 0
          fi

          git commit -m "PIXVA V14.13 PayPal Zahlen final"
          git push origin HEAD:main
