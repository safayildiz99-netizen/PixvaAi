services:
  - type: web
    name: safa-ai-studio
    runtime: node
    plan: free
    buildCommand: npm install && npm run setup && npm run build
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: POLLINATIONS_KEY
        sync: false
